<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>規格選項</title>
<link rel="stylesheet" href="css/pos.css?v=161">
<link rel="stylesheet" href="css/dialog-theme.css?v=161">
</head>
<body>
<div id="field-editor" v-cloak>
  <form class="dialog-shell" @submit.prevent="save">
    <div class="dialog-content">
      <div v-if="loading" class="dialog-loading">正在載入規格資料…</div>
      <template v-else>
        <section class="dialog-section">
          <h2>{{ name }}</h2>
          <label class="dialog-field" v-if="fieldType==='select'">建檔預設帶入
            <select v-model="defaultOptionId">
              <option :value="null">(無)</option>
              <option v-for="o in activeOptions" :key="o.option_id"
                      :value="o.option_id">{{ o.value }}</option>
            </select>
          </label>
          <div class="dialog-hint">名稱、欄位型態、必填與啟用狀態於規格清單列上設定。</div>
        </section>

        <section class="dialog-section" v-if="hasOptions">
          <h2>選項</h2>
          <div class="dialog-barcode-add">
            <input v-model="newOption" placeholder="新增選項"
                   @keydown.enter="handleOptionEnter">
            <button type="button" class="dialog-small" @click="addOption">加入</button>
            <button type="button" class="dialog-small" @click="cleanupOptions">清理未使用選項</button>
          </div>
          <div class="dialog-barcode-list">
            <div v-for="o in options" :key="o.option_id" class="dialog-barcode-row"
                 :class="{inactive: !o.active}">
              <span>{{ o.value }}</span>
              <span class="dialog-hint">{{ o.usage_count }} 使用中{{ o.active ? '' : '(已停用)' }}</span>
              <button type="button" class="dialog-small danger"
                      @click="deleteOption(o)">刪除</button>
            </div>
            <div v-if="!options.length" class="dialog-hint">尚無選項</div>
          </div>
        </section>
      </template>
    </div>

    <footer class="dialog-footer">
      <div v-if="error" class="dialog-error">{{ error }}</div>
      <div class="dialog-actions">
        <button type="button" class="dialog-cancel" :disabled="saving" @click="cancel">取消</button>
        <button type="submit" class="dialog-confirm" :disabled="saving || loading">
          {{ saving ? '儲存中…' : '儲存' }}
        </button>
      </div>
    </footer>
  </form>
</div>
<script src="js/vue.global.prod.js?v=161"></script>
<script src="js/api.js?v=161"></script>
<script src="js/confirm.js?v=161"></script>
<script src="js/field_editor.js?v=161"></script>
</body>
</html>
