<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>補售價</title>
<link rel="stylesheet" href="css/pos.css?v=262">
<link rel="stylesheet" href="css/dialog-theme.css?v=262">
</head>
<body>
<div id="price-fill" v-cloak>
  <div class="dialog-shell">
    <div class="pf-toolbar">
      <label>種類
        <select v-model="category" @change="onCategoryChange">
          <option value="">（全部）</option>
          <option v-for="c in categories" :key="c" :value="c">{{ c }}</option>
        </select>
      </label>
      <label>廠牌
        <select v-model="brand">
          <option value="">（全部）</option>
          <option v-for="b in brands" :key="b" :value="b">{{ b }}</option>
        </select>
      </label>
      <label class="pf-keyword">關鍵字
        <input ref="keyword" v-model="keyword" placeholder="品名、規格、型號、條碼">
      </label>
      <label class="dialog-check pf-only-empty"><input type="checkbox" v-model="onlyEmpty">只看未定價</label>
      <span class="pf-spacer"></span>
      <label class="pf-batch">售價
        <input v-model="batchPrice" inputmode="numeric" @keydown.enter.prevent="fillSelected">
      </label>
      <button type="button" class="dialog-small" @click="fillSelected">填入選取列</button>
    </div>

    <div class="pf-table">
      <div v-if="loading" class="dialog-loading">正在載入子產品…</div>
      <table v-else class="dialog-table">
        <colgroup>
          <col style="width:9%"><col style="width:9%"><col style="width:20%">
          <col style="width:22%"><col style="width:16%"><col style="width:14%">
          <col class="pf-price-col">
        </colgroup>
        <thead>
          <tr><th>種類</th><th>廠牌</th><th>品名</th><th>規格</th><th>型號</th><th>條碼</th><th>售價</th></tr>
        </thead>
        <tbody>
          <tr v-for="(row, index) in visibleRows" :key="row.variant_id"
              :class="{selected: selected[row.variant_id], changed: row.variant_id in changes}"
              @mousedown="onRowMousedown($event)" @click="onRowClick($event, row, index)">
            <td class="pf-clip" :title="row.category">{{ row.category }}</td>
            <td class="pf-clip" :title="row.brand">{{ row.brand }}</td>
            <td class="pf-clip" :title="row.name">{{ row.name }}</td>
            <td>{{ row.spec }}</td>
            <td>{{ row.models }}</td>
            <td>{{ row.barcode }}</td>
            <td><input class="pf-price" :data-index="index" inputmode="numeric"
                       :value="priceText(row)" @change="setPriceFromInput(row, $event)"
                       @keydown.enter.prevent="moveNext(row, index, $event)"></td>
          </tr>
          <tr v-if="!visibleRows.length"><td colspan="7" class="dialog-hint">沒有符合條件的子產品</td></tr>
        </tbody>
      </table>
    </div>

    <footer class="dialog-footer">
      <div v-if="error" class="dialog-error">{{ error }}</div>
      <div class="dialog-actions">
        <span class="dialog-hint dialog-actions-spacer">
          顯示 {{ visibleRows.length }} 筆／共 {{ rows.length }} 筆　已選 {{ selectedCount }} 筆　未儲存 {{ changeCount }} 筆
          （點選列可用 Ctrl 加選、Shift 連選；藍色粗字售價＝未儲存）
        </span>
        <button type="button" class="dialog-cancel" :disabled="saving" @click="cancel">關閉</button>
        <button type="button" class="dialog-confirm" :disabled="saving || loading || !changeCount" @click="save">
          {{ saving ? '儲存中…' : '儲存' }}
        </button>
      </div>
    </footer>
  </div>
</div>
<script src="js/vue.global.prod.js?v=262"></script>
<script src="js/api.js?v=262"></script>
<script src="js/confirm.js?v=262"></script>
<script src="js/auth.js?v=262"></script>
<script src="js/price_fill.js?v=262"></script>
</body>
</html>
