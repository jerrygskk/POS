<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新增款式</title>
<link rel="stylesheet" href="css/pos.css?v=191">
<link rel="stylesheet" href="css/dialog-theme.css?v=191">
</head>
<body>
<div id="variant-batch-window" v-cloak>
  <div v-if="error" class="dialog-error">{{ error }}</div>
  <page-variant-batch ref="batchPage" v-if="ready" :init-category-id="initCategoryId"
                      :init-product-id="initProductId"></page-variant-batch>
</div>

<template id="tpl-variant-batch">
<div class="dialog-shell batch-shell">
  <div class="dialog-content batch-content">
    <h1>新增款式</h1>

    <section v-if="product && selectionCollapsed" class="dialog-section batch-product-summary">
      <strong>{{ category ? category.name : '—' }}｜{{ product.name }}</strong>
      <span>廠牌 {{ product.brand_name || '—' }}｜備註 {{ product.note || '—' }}</span>
      <button type="button" class="dialog-small" @click="reopenProductSelection">變更產品</button>
    </section>
    <section v-else class="dialog-section batch-product-select">
      <h2>產品</h2>
      <label class="dialog-field">種類
        <select v-model.number="catId" @change="onCategoryChange">
          <option :value="null">選擇種類</option>
          <option v-for="c in categories" :key="c.category_id" :value="c.category_id">
            {{ c.name }}
          </option>
        </select>
      </label>
      <label class="dialog-field">產品
        <select v-model.number="productId" @change="onProductChange" :disabled="catId==null">
          <option :value="null">選擇產品</option>
          <option v-for="p in catProducts" :key="p.product_id" :value="p.product_id">
            {{ p.name }}
          </option>
        </select>
      </label>
      <div v-if="catId!=null && !catProducts.length" class="dialog-hint">
        此種類尚無產品，請先於設定建立。
      </div>
    </section>

    <section v-if="product && productReady" class="dialog-section batch-input"
             :class="{collapsed:inputCollapsed}">
      <div class="batch-input-head clickable" @click="inputCollapsed=!inputCollapsed">
        <h2>組合輸入</h2>
        <span class="dialog-hint">{{ inputCollapsed ? '已收合，點此繼續新增組合 ▼' : '收合 ▲' }}</span>
      </div>
      <transition name="collapse">
      <div v-show="!inputCollapsed" class="batch-input-body">
        <div v-for="f in formalFields" :key="f.field_id" class="attr-row">
          <div class="attr-name">
            {{ f.name }}<span v-if="f.required"> *</span>
            <small v-if="f.field_type==='select'" class="field-kind-note">可複選以產生組合</small>
            <small v-else-if="f.field_type==='multi'" class="apply-all-note">套用至每一筆</small>
            <span v-if="f.field_type==='select' && optionCount(f.name)>=2" class="expand-badge">
              已選擇 {{ optionCount(f.name) }} 個{{ f.name }}
            </span>
          </div>
          <div v-if="f.field_type==='select'" class="batch-input-control">
            <opt-picker v-if="fieldUsage[f.field_id]" :model-value="input.attrs[f.name]"
                        :usage="fieldUsage[f.field_id]" :multiple="true" :as-list="true"
                        :model-ids="input.model_ids" :placeholder="'搜尋或輸入'+f.name"
                        @update:model-value="setInputAttr(f.name,$event)"></opt-picker>
            <span v-else class="dialog-hint">候選載入中…</span>
          </div>
          <opt-picker v-else-if="f.field_type==='multi' && fieldUsage[f.field_id]"
                      :model-value="input.attrs[f.name]" :usage="fieldUsage[f.field_id]"
                      :multiple="true" :as-list="true" :model-ids="input.model_ids"
                      :placeholder="'搜尋或輸入'+f.name"
                      @update:model-value="setInputAttr(f.name,$event)"></opt-picker>
          <span v-else-if="f.field_type==='multi'" class="dialog-hint">候選載入中…</span>
          <input v-else v-model="input.attrs[f.name]" :placeholder="'輸入'+f.name">
        </div>

        <div v-if="featureField" class="attr-row">
          <div class="attr-name">
            {{ featureField.name }}
            <small class="apply-all-note">套用至每一筆</small>
          </div>
          <tag-selector v-model="input.attrs[featureField.name]"
                        :usage="tagUsage"></tag-selector>
        </div>

        <div v-if="modelMode==='required'" class="attr-row">
          <div class="attr-name">
            適用手機型號
            <small class="apply-all-note">套用至每一筆</small>
          </div>
          <model-picker :models="models" :usage="modelUsage"
                        v-model:model_ids="input.model_ids"></model-picker>
        </div>

        <div class="batch-price-barcode">
          <label>售價
            <input type="number" v-model.number="input.price" min="0" placeholder="可留空">
          </label>
          <label>原廠條碼
            <input v-model="input.barcode" :disabled="previewCount>1" placeholder="可留空">
            <small v-if="previewCount>1" class="field-kind-note">請於預覽表逐筆掃描</small>
          </label>
          <label class="dialog-check">
            <input type="checkbox" v-model="input.store"> 配自取碼
          </label>
        </div>

        <div class="batch-formula">
          <span>{{ inputFormula || '單一組合' }}</span>
          <strong>將產生 {{ previewCount }} 筆</strong>
          <button type="button" class="dialog-confirm" :disabled="generating || submitting"
                  @click="generatePreview">{{ generating ? '產生中…' : '產生預覽' }}</button>
        </div>
      </div>
      </transition>
    </section>

    <div v-if="skipped.length" class="batch-skipped">
      <button type="button" class="batch-summary-toggle" @click="showSkipped=!showSkipped">
        <span>{{ showSkipped ? '收合' : '展開' }}</span>
        已略過 {{ skipped.length }} 筆（與既有款式重複）
      </button>
      <div v-if="showSkipped" class="batch-skipped-list">
        <div v-for="item in skipped" :key="item.row.draft_id" class="batch-skipped-row">
          <span>{{ draftSpecText(item.row) }}</span>
          <span>既有：{{ existingVariantText(item) }}</span>
        </div>
      </div>
    </div>

    <section v-if="fixedEditor && fixedDraft" class="batch-fixed-editor">
      <div class="batch-fixed-head">
        <strong>編輯第 {{ draftNumber(fixedDraft) }} 筆｜
          {{ fixedEditor.fieldName==='__models' ? '適用手機型號' : fixedEditor.fieldName }}</strong>
        <button type="button" class="dialog-small dialog-confirm" @click="closeFixedEditor">完成</button>
      </div>
      <model-picker v-if="fixedEditor.fieldName==='__models'" :models="models"
                    :usage="modelUsage"
                    v-model:model_ids="fixedDraft.model_ids"></model-picker>
      <tag-selector v-else-if="fixedField && fixedField.field_type==='tags'"
                    v-model="fixedDraft.attrs[fixedField.name]" :usage="tagUsage"></tag-selector>
      <opt-picker v-else-if="fixedField && fixedField.field_type==='multi'"
                  v-model="fixedDraft.attrs[fixedField.name]"
                  :usage="fieldUsage[fixedField.field_id] || []"
                  :multiple="true" :as-list="true" :model-ids="fixedDraft.model_ids"></opt-picker>
    </section>

    <section v-if="drafts.length" class="batch-preview">
      <div class="batch-toolbar">
        <strong>產品組合預覽（共 {{ drafts.length }} 筆）</strong>
        <button v-if="lastDeleted" type="button" class="dialog-small"
                @click="undoDelete">復原刪除</button>
      </div>

      <div class="batch-table">
        <table class="dialog-table" :style="{width:tableWidth+'px'}">
          <colgroup>
            <col v-for="col in columnDefs" :key="col.key"
                 :style="{width:columnWidths[col.key]+'px'}">
          </colgroup>
          <thead>
            <tr>
              <th v-for="col in columnDefs" :key="col.key" :title="col.label">
                <span class="batch-col-label">{{ col.label }}</span>
                <span class="batch-col-grip" title="拖曳調整欄寬，雙擊還原"
                      @mousedown.prevent="startColResize(col.key,$event)"
                      @dblclick="resetColWidth(col.key)"></span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(d,i) in drafts" :key="d.draft_id" :data-draft="d.draft_id"
                :class="{duplicate:duplicateErrors(d).length}">
              <td class="batch-seq">{{ i + 1 }}</td>
              <td class="batch-row-actions">
                <button type="button" class="dialog-icon" title="複製此列"
                        aria-label="複製此列" @click="duplicateRowAt(i)">⧉</button>
                <button type="button" class="dialog-icon danger" title="刪除此列"
                        aria-label="刪除此列" @click="removeDraft(i)">✕</button>
              </td>
              <template v-for="f in formalFields" :key="f.field_id">
                <td :class="{'cell-error':fieldErrors(d,f).length}"
                    :title="errorText(fieldErrors(d,f))">
                  <select v-if="f.field_type==='select'" v-model="d.attrs[f.name]"
                          @change="schedulePrecheck">
                    <option value="">未選擇</option>
                    <option v-for="value in fieldOptions(f,d)" :key="value" :value="value">
                      {{ value }}{{ fieldOptionInactive(f,value) ? '（停用，將重新啟用）' : '' }}
                    </option>
                  </select>
                  <button v-else-if="f.field_type==='multi'" type="button" class="batch-cell-button"
                          @click="openFixedEditor(d.draft_id,f.name)">
                    {{ Array.isArray(d.attrs[f.name]) && d.attrs[f.name].length
                      ? d.attrs[f.name].join('＋') : '—' }}
                  </button>
                  <input v-else v-model="d.attrs[f.name]" @change="schedulePrecheck">
                  <small v-for="(err,ei) in fieldErrors(d,f)" :key="ei" class="cell-error-text">
                    {{ err.message }}
                  </small>
                </td>
              </template>
              <td v-if="featureField"
                  >
                <button type="button" class="batch-cell-button"
                        :title="draftTags(d) || '—'"
                        @click="openFixedEditor(d.draft_id,featureField.name)">
                  {{ draftTags(d) || '—' }}
                </button>
              </td>
              <td v-if="modelMode==='required'" class="batch-cell-model"
                  :class="{'cell-error':modelErrors(d).length}"
                  :title="errorText(modelErrors(d))">
                <button type="button" class="batch-cell-button"
                        :title="draftModels(d) || '尚未選擇型號'"
                        @click="openFixedEditor(d.draft_id,'__models')">
                  {{ draftModels(d) || '—' }}
                </button>
                <small v-for="(err,ei) in modelErrors(d)" :key="ei" class="cell-error-text">
                  {{ err.message }}
                </small>
              </td>
              <td class="batch-cell-price">
                <input type="number" min="0" v-model.number="d.price" @change="schedulePrecheck">
              </td>
              <td class="batch-cell-barcode"
                  :class="{'cell-error':barcodeErrors(d).length}"
                  :title="errorText(barcodeErrors(d))">
                <input v-model="d.barcode" @change="schedulePrecheck" placeholder="原廠條碼">
                <label class="batch-store-check">
                  <input type="checkbox" v-model="d.store" @change="schedulePrecheck"> 配自取碼
                </label>
                <small v-for="(err,ei) in barcodeErrors(d)" :key="ei" class="cell-error-text">
                  {{ err.message }}
                </small>
              </td>
              <td class="batch-status" :class="{'cell-error':errorsFor(d).length}"
                  :title="errorText(errorsFor(d))">
                <button v-if="duplicateTargetId(d)" type="button" class="batch-status-link"
                        @click="gotoDraft(duplicateTargetId(d))">{{ rowStatus(d) }}</button>
                <template v-else>{{ rowStatus(d) }}</template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <div v-if="doneMsg" class="dialog-done">{{ doneMsg }}</div>
  </div>

  <footer class="dialog-footer batch-footer">
    <div class="dialog-actions">
      <span class="dialog-hint dialog-actions-spacer">
        {{ skipped.length ? '已略過 '+skipped.length+' 筆｜' : '' }}待建立 {{ drafts.length }} 筆
      </span>
      <button type="button" class="dialog-cancel" @click="closeWindow">關閉</button>
      <button type="button" class="dialog-confirm"
              :disabled="!drafts.length || submitting || generating" @click="commitAll">
        {{ submitting ? '建立中…' : '建立 '+drafts.length+' 筆' }}
      </button>
    </div>
  </footer>
</div>
</template>

<script src="js/vue.global.prod.js?v=191"></script>
<script src="js/api.js?v=191"></script>
<script src="js/confirm.js?v=191"></script>
<script src="js/pos_shared.js?v=191"></script>
<script src="js/catalogfields.js?v=191"></script>
<script src="js/modelpicker.js?v=191"></script>
<script src="js/optpicker.js?v=191"></script>
<script src="js/variant_batch_logic.js?v=191"></script>
<script src="js/variant_batch.js?v=191"></script>
<script src="js/variant_batch_window.js?v=191"></script>
</body>
</html>
