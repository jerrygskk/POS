<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>膜型機門市管理系統</title>
<link rel="stylesheet" href="css/pos.css?v=336">
</head>
<body>
<div id="app">
  <nav :class="{admin: auth.isAdmin}">
    <img class="nav-logo" src="img/logo.png?v=336" alt="膜型機品牌標誌">
    <button v-for="[key, label] in pages" :key="key"
            :class="{active: page===key}" @click="goPage(key)">{{ label }}<span
              v-if="key==='stocktake' && auth.isAdmin && auth.pendingStocktakes > 0"
              class="badge">{{ auth.pendingStocktakes }}</span><span
              v-if="key==='returns' && auth.isAdmin && auth.pendingReturns > 0"
              class="badge">{{ auth.pendingReturns }}</span></button>
    <button style="margin-left:auto; white-space:nowrap" @click="toggleAdmin"><span
      v-if="auth.isAdmin" class="badge">管理者</span>{{ auth.isAdmin ? '登出管理者' : '管理者登入' }}</button>
  </nav>
  <div class="error-bar" v-if="error">⚠ {{ error }}</div>
  <component :is="'page-' + page"></component>
</div>
<!-- 各頁模板集中於此,由各 js 以 template: '#tpl-xxx' 引用 -->
<template id="tpl-checkout">
<div class="page checkout">
  <div class="scan-row"><employee-picker></employee-picker></div>
  <div class="scan-row">
    <input ref="scan" v-model="scanCode" @keyup.enter="onScan"
           placeholder="掃描條碼或輸入後按 Enter" class="scan-input" autofocus>
    <input v-model="searchQ" @keyup.enter="onSearch" placeholder="關鍵字搜尋商品">
  </div>
  <div v-if="searchResults.length" class="search-pop">
    <div v-for="r in searchResults" :key="r.variant_id" class="search-item"
         @click="addItem(r)">
      {{ r.name }}|{{ attrText(r) }}|
      {{ r.price === null ? '未定價' : r.price + ' 元' }}|庫存 {{ r.stock }}
    </div>
  </div>
  <table class="cart-table">
    <colgroup>
      <col class="cart-col-barcode">
      <col><col><col>
      <col class="cart-col-price"><col class="cart-col-qty"><col class="cart-col-discount"><col class="cart-col-sale">
      <col class="cart-col-subtotal"><col class="cart-col-stock"><col class="cart-col-remove">
    </colgroup>
    <thead><tr><th>條碼</th><th>商品</th><th>適用機型</th><th>屬性</th><th>原價</th><th>數量</th>
      <th>折扣</th><th>實售價</th><th>小計</th><th>庫存</th><th></th></tr></thead>
    <tbody>
      <tr v-for="(it, i) in draft.cart" :key="it.variant_id">
        <td>{{ it.label_barcode || '—' }}</td>
        <td>{{ it.name }}</td>
        <td>{{ modelsText(it) }}</td>
        <td>{{ attrText(it) }}</td>
        <td>{{ it.unit_price }}</td>
        <td><input type="text" inputmode="numeric" class="w60" :value="it.qty" @input="setItemQty(it, $event)" :disabled="draft.submitting"
                   @change="it.qty = Math.max(1, Math.floor(it.qty) || 1)"></td>
        <td><div class="rate-btns"><button v-for="r in rates" :key="r" type="button" class="chip" :class="{on: it.rate === r}"
              @click="toggleRate(it, r)" :disabled="draft.submitting">{{ r % 10 ? r : r / 10 }}</button></div></td>
        <td :class="{'cell-error': it.sale_price > it.unit_price}"><input type="text" inputmode="numeric" class="w60" :value="it.sale_price" @input="setSalePrice(it, $event)" :disabled="draft.submitting"></td>
        <td>{{ it.qty * it.unit_price - lineDiscount(it) }}</td>
        <td :class="{neg: it.qty > it.stock}">{{ it.stock }}</td>
        <td><button class="btn-x" title="移除" @click="removeItem(i)" :disabled="draft.submitting">✕</button></td>
      </tr>
    </tbody>
    <tfoot v-if="draft.cart.length" class="cart-summary">
      <tr><td colspan="5">小計</td><td>{{ cartQty }}</td><td>{{ cartDiscount }}</td><td></td><td>{{ cartSubtotal }}</td><td colspan="2"></td></tr>
    </tfoot>
  </table>
  <div class="pay-panel">
    <label>整單折抵 <input type="text" inputmode="numeric" class="w80" :value="draft.orderDiscount" @input="setDiscount('orderDiscount', $event)" :disabled="draft.submitting"></label>
    <label>會員折扣 <input type="text" inputmode="numeric" class="w80" :value="draft.memberDiscount" @input="setDiscount('memberDiscount', $event)" :disabled="draft.submitting"></label>
    <span v-if="draft.member" class="member-picked">會員：{{ draft.member.name }} {{ draft.member.phone }}
      <button class="btn-x" title="清除會員" @click="clearMember" :disabled="draft.submitting">✕</button></span>
    <span v-else class="member-lookup"><input type="text" inputmode="numeric" class="w160" placeholder="會員電話末三碼"
      :value="memberQuery" @input="setMemberQuery($event)" @keydown.enter="lookupMember" :disabled="draft.submitting">
      <button @click="lookupMember" :disabled="draft.submitting">查詢會員</button></span>
    <label>付款方式
      <select v-model="payment" :disabled="draft.submitting"><option v-for="p in payments" :key="p">{{ p }}</option></select>
    </label>
    <div class="total">應收 {{ total }} 元</div>
    <label>實收 <input type="text" inputmode="numeric" class="w80" :value="isCash ? paid : total" @input="setPaid($event)" :disabled="draft.submitting || !isCash"></label>
    <div class="total">找零 {{ Math.max(0, paidAmount - total) }} 元</div>
    <button class="primary" :disabled="draft.submitting || !draft.cart.length || paidAmount < total"
            @click="checkout">結帳</button>
  </div>
  <member-editor v-if="memberEdit" :member="memberEdit" @close="memberEditClosed"></member-editor>
  <div v-if="doneMsg" class="done-msg">{{ doneMsg }}</div>
  <template v-if="recent.length">
  <div class="grp-title recent-sales-title">本日最近成交
    <button class="btn-sm" @click="toggleRecent">{{ recentOpen ? '收合 ▲' : '展開 ▼' }}</button></div>
  <transition name="collapse"><div v-if="recentOpen">
  <table>
    <thead><tr><th>編號</th><th>時間</th><th>員工</th><th>商品</th><th>應收</th></tr></thead>
    <tbody><tr v-for="s in recent" :key="s.sale_id" :class="{'sale-void': s.voided_at}">
      <td>{{ s.sale_id }}</td><td>{{ s.ts }}<span v-if="s.voided_at" class="tag records-tag">已作廢</span></td><td>{{ s.employee }}</td>
      <td>{{ itemsText(s) }}</td><td>{{ s.total }}</td>
    </tr></tbody>
  </table>
  </div></transition>
  </template>
</div>
</template>
<template id="tpl-labels">
<div class="page">
  <div class="scan-row">
    <input ref="scan" v-model="query" @keyup.enter="submitInput" :disabled="q.printing"
           placeholder="掃描條碼或輸入關鍵字" class="scan-input">
    <button @click="submitInput" :disabled="q.printing">加入</button>
  </div>
  <div v-if="searched && !results.length" class="notice-bar">查無此條碼或商品。</div>
  <div v-if="results.length" class="search-pop">
    <div v-for="r in results" :key="r.variant_id" class="search-item"
         :title="modelsTitle(r)" @click="pick(r)">{{ rowText(r) }}</div>
  </div>
  <div v-if="q.notice" class="notice-bar">{{ q.notice }}</div>
  <div v-if="q.rows.length" class="label-queue">
    <table class="fixed-table">
      <thead><tr><th>品名</th><th>規格</th><th class="col-w70">價格</th><th class="col-w142">條碼</th>
        <th class="col-w81">張數</th><th class="col-w80">狀態</th><th :class="q.rows.some(r => r.status === 'verify') ? 'col-w160' : 'col-w70'"></th></tr></thead>
      <tbody>
        <tr v-for="row in q.rows" :key="row.key" :class="{on: row.key === q.selectedKey}"
            @click="selectRow(row.key)">
          <td :title="(row.label.models || []).join('、') || null">{{ row.label.name }}</td>
          <td>{{ row.label.specification }}</td>
          <td>{{ row.label.price }}</td>
          <td>{{ row.barcode }}</td>
          <td><input type="number" min="1" max="99" class="w60" :value="row.copies"
                     :disabled="q.printing" @click.stop
                     @change="setCopies(row, $event.target)"></td>
          <td :class="{neg: row.status === 'verify' || row.status === 'invalid'}">{{ statusText(row) }}</td>
          <td>
            <button v-if="row.status === 'verify'" class="btn-sm" :disabled="q.printing"
                    @click.stop="confirmCopies(row)">確認張數</button>
            <button class="btn-sm danger" :disabled="q.printing"
                    @click.stop="removeRow(row)">移除</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="label-preview">
      <img v-if="q.previewUrl" :src="q.previewUrl" alt="標籤預覽">
    </div>
  </div>
  <div v-if="q.rows.length" class="label-panel">
    <button class="primary" :disabled="q.printing" @click="printAll">
      {{ q.printing ? '列印中…' : `全部列印（共 ${totalCopies()} 張）` }}</button>
    <button :disabled="q.printing" @click="clearAll">清空清單</button>
  </div>
</div>
</template>
<template id="tpl-receive">
<div class="page receive">
  <div class="scan-row"><employee-picker></employee-picker>
    <span class="mode-switch">
      <button type="button" class="chip-toggle" :class="{on: draft.mode==='normal'}" @click="setMode('normal')">一般進貨</button>
      <button type="button" class="chip-toggle" :class="{on: draft.mode==='repair'}" @click="setMode('repair')">返新進貨</button>
    </span></div>
  <div v-if="draft.mode==='repair'">
  <div class="scan-row">
    <input ref="repairInput" v-model="draft.repairInput" class="w160" inputmode="numeric" placeholder="退貨單號"
           @keyup.enter="loadRepair" :disabled="draft.repairBusy">
    <button @click="loadRepair" :disabled="draft.repairBusy">帶入</button>
  </div>
  <table class="cart-table receive-table">
    <colgroup><col><col class="col-w240"><col class="col-w72"><col class="col-w72"><col class="col-w72"><col class="col-w72"><col class="receive-col-qty-label"></colgroup>
    <thead><tr><th>商品</th><th>規格</th><th class="num">返修數</th><th class="num">已返新</th><th class="num">已結案</th><th class="num">未處理</th>
      <th>本次返新</th></tr></thead>
    <tbody>
      <tr v-if="!draft.repair"><td colspan="7" class="hint">請輸入返修中的退貨單號後按「帶入」。</td></tr>
      <tr v-for="it in repairItems()" :key="it.id">
        <td>{{ it.name }}<div v-if="it.reason" class="receive-reason">退貨原因：{{ it.reason }}</div></td><td>{{ attrText(it) }}</td>
        <td class="num">{{ it.qty }}</td><td class="num">{{ it.repaired_qty }}</td><td class="num">{{ it.closed_qty }}</td>
        <td class="num">{{ repairLeft(it) }}</td>
        <td><div class="qty-label"><input ref="repairQtyInputs" type="number" class="w80" min="0" :max="repairLeft(it)" :value="draft.repairQty[it.id] || 0"
                   :disabled="draft.repairBusy || repairLeft(it) === 0" @change="setRepairQty(it, $event)">
            <button v-if="(draft.repairQty[it.id] || 0) > (draft.repairLabeled[it.id] || 0) && it.label_barcode" class="btn-sm"
                    :disabled="draft.repairBusy" @click="addRepairLabels(it)">列印 {{ (draft.repairQty[it.id] || 0) - (draft.repairLabeled[it.id] || 0) }} 張</button>
            <span v-else-if="draft.repairLabeled[it.id]" class="hint">已加入 {{ draft.repairLabeled[it.id] }} 張</span></div></td>
      </tr>
    </tbody>
  </table>
  <div class="pay-panel">
    <div v-if="draft.repair">退貨單 {{ draft.repair.return_id }}（開單 {{ draft.repair.started_at }}）</div>
    <button class="primary" :disabled="draft.repairBusy || !draft.repair" @click="confirmRepair">確認返新</button>
  </div>
  </div>
  <div v-else>
  <div class="scan-row">
    <input ref="scan" v-model="scanCode" @keyup.enter="onScan"
           placeholder="掃描條碼進貨" class="scan-input">
  </div>
  <div v-if="draft.notFound" class="notice-bar">
    查無條碼「{{ draft.notFound }}」。進貨不建立產品，{{ isAdmin ? '請先至商品設定建立產品與子產品。' : '請管理者先建立產品與子產品。' }}
    <button v-if="isAdmin" @click="goSettings">前往商品設定</button>
  </div>
  <table class="cart-table receive-table">
    <colgroup>
      <col><col><col>
      <col class="receive-col-barcode"><col class="cart-col-stock"><col class="receive-col-qty-label">
      <col class="cart-col-remove">
    </colgroup>
    <thead><tr><th>商品</th><th>適用機型</th><th>規格</th><th>條碼</th><th>庫存</th>
      <th>進貨數量</th><th></th></tr></thead>
    <tbody>
      <tr v-if="!draft.rows.length"><td colspan="7" class="hint">請掃描條碼加入進貨清單。</td></tr>
      <tr v-for="row in draft.rows" :key="row.variant_id"
          :class="{'receive-row-hit': draft.highlightKey === row.variant_id}">
        <td>{{ row.name }}</td>
        <td>{{ modelsText(row) }}</td>
        <td>{{ attrText(row) }}</td>
        <td>{{ row.label_barcode }}</td>
        <td>{{ row.stock }}</td>
        <td><div class="qty-label"><input type="number" :value="row.qty" min="1" class="w80"
                   :disabled="draft.locked" @change="setQty(row, $event)">
            <button v-if="row.qty > row.labeled" class="btn-sm"
                    :disabled="row.labelBusy || draft.locked" @click="addToLabels(row)">列印 {{ row.qty - row.labeled }} 張</button>
            <span v-else-if="row.labeled > 0" class="hint">已加入 {{ row.labeled }} 張</span></div></td>
        <td><button class="btn-x" title="移除" :disabled="draft.locked" @click="removeRow(row)">✕</button></td>
      </tr>
    </tbody>
  </table>
  <div class="pay-panel">
    <div>共 {{ draft.rows.length }} 項、{{ totalQty }} 件</div>
    <button class="primary" :disabled="draft.locked || !draft.rows.length" @click="confirmReceive">確認進貨</button>
    <button :disabled="draft.locked || !draft.rows.length" @click="clearAll">清空</button>
  </div>
  </div>
  <div v-if="draft.doneMsg" class="done-msg">{{ draft.doneMsg }}</div>
</div>
</template>
<template id="tpl-stocktake">
<div class="page">
  <div v-if="!current">
    <div class="scan-row">
      <employee-picker></employee-picker>
      <button class="primary" @click="openNew">開新盤點單</button>
    </div>
    <table>
      <thead><tr><th>單號</th><th>開始時間</th><th>狀態</th><th>員工</th><th></th></tr></thead>
      <tbody><tr v-for="s in sessions" :key="s.session_id">
        <td>{{ s.session_id }}</td><td>{{ s.started_at }}</td>
        <td>{{ statusText(s.status) }}</td><td>{{ s.employee }}</td>
        <td><div class="card-actions">
            <button v-if="s.status==='open'" @click="enter(s.session_id)">續盤</button>
            <button v-else @click="enter(s.session_id)">{{ s.status==='pending' && isAdmin ? '審核' : '檢視' }}</button>
            <button v-if="s.status==='pending'" :disabled="busy" @click="withdraw(s.session_id)">抽回修改</button>
            <button v-if="s.status==='open' || (s.status==='pending' && isAdmin)"
                    :disabled="busy" @click="cancel(s)">作廢</button></div></td>
      </tr></tbody>
    </table>
  </div>
  <div v-else>
    <div class="scan-row">
      <input ref="scan" v-model="scanCode" @keyup.enter="onScan"
             class="scan-input" placeholder="掃描條碼(重複掃自動累加)"
             :disabled="detail.status!=='open'">
      <button @click="current=null; detail=null; reload()">返回列表</button>
      <button class="primary" v-if="detail.status==='open'" @click="close">送出</button>
      <button class="primary" v-if="canReview" :disabled="marked.length > 0" @click="approve">核准</button>
      <button class="primary" v-if="canReview" :disabled="!marked.length" @click="returnItems">退回重盤（{{ marked.length }} 項）</button>
    </div>
    <div v-if="detail.status==='pending' && !isAdmin" class="notice-bar">等待管理者核准</div>
    <div v-if="recountCount" class="notice-bar">有 {{ recountCount }} 項需重新清點</div>
    <table class="fixed-table detail-table">
      <thead><tr><th>商品</th><th>屬性</th><th class="col-w80">系統量</th><th class="col-w160">實盤量</th><th class="col-w70">差異</th><th class="col-w200">差異原因</th>
        <th v-if="canReview" class="col-w110"></th><th v-if="canEditCounted" class="cart-col-remove"></th></tr></thead>
      <tbody><tr v-for="it in detail.items" :key="it.variant_id" :class="{neg: it.needs_recount, 'stocktake-row-returned': marked.includes(it.variant_id)}">
        <td>{{ it.name }}</td><td>{{ attrText(it) }}</td>
        <td>{{ it.system_qty }}</td>
        <td><input type="number" v-model.number="it.counted_qty" min="0" class="w80"
                   :disabled="!canEditCounted" @change="setCounted(it)">
          <button v-if="it.needs_recount && canEditCounted" class="btn-sm" @click="setCounted(it)">確認</button></td>
        <td :class="{neg: it.diff < 0}">{{ it.diff > 0 ? '+' + it.diff : it.diff }}</td>
        <td><input v-if="it.diff !== 0 && canEditCounted" v-model="it.note" maxlength="100"
                   placeholder="選填" @change="setNote(it)"><template v-else>{{ it.note }}</template></td>
        <td v-if="canReview"><button v-if="marked.includes(it.variant_id)" class="btn-sm danger" @click="toggleMark(it)">取消退回</button>
          <button v-else class="btn-sm" @click="toggleMark(it)">退回</button></td>
        <td v-if="canEditCounted"><button class="btn-x" title="移除" @click="removeItem(it)">✕</button></td>
      </tr></tbody>
    </table>
  </div>
</div>
</template>
<template id="tpl-returns">
<div class="page">
  <div v-if="!current">
    <div class="scan-row">
      <employee-picker></employee-picker>
      <button class="primary" @click="openNew">開新退貨單</button>
    </div>
    <table>
      <thead><tr><th>單號</th><th>開單時間</th><th>狀態</th><th>員工</th><th></th></tr></thead>
      <tbody><tr v-for="s in sessions" :key="s.return_id">
        <td>{{ s.return_id }}</td><td>{{ s.started_at }}</td>
        <td>{{ statusText(s.status) }}</td><td>{{ s.employee }}</td>
        <td><div class="card-actions">
            <button v-if="s.status==='open'" @click="enter(s.return_id)">繼續</button>
            <button v-else @click="enter(s.return_id)">{{ s.status==='pending' && isAdmin ? '審核' : '檢視' }}</button>
            <button v-if="s.status==='pending'" @click="withdraw(s.return_id)">抽回修改</button>
            <button v-if="s.status==='open' || (s.status==='pending' && isAdmin)"
                    @click="cancel(s)">作廢</button></div></td>
      </tr></tbody>
    </table>
  </div>
  <div v-else>
    <div class="scan-row">
      <input ref="scan" v-model="scanCode" @keyup.enter="onScan"
             class="scan-input" placeholder="掃描條碼(重複掃自動累加)"
             :disabled="!canEdit">
      <button @click="current=null; detail=null; reload()">返回列表</button>
      <button class="primary" v-if="canEdit" @click="close">送出</button>
      <button class="primary" v-if="canReview" :disabled="kindBusy" @click="approve">核准</button>
      <span v-if="canReview" class="mode-switch">
        <button type="button" class="chip-toggle" :class="{on: detail.kind==='normal'}" :disabled="kindBusy" @click="setKind('normal')">一般退貨</button>
        <button type="button" class="chip-toggle" :class="{on: detail.kind==='repair'}" :disabled="kindBusy" @click="setKind('repair')">返修</button>
      </span>
    </div>
    <div v-if="detail.status==='pending' && !isAdmin" class="notice-bar">等待管理者核准</div>
    <table class="fixed-table detail-table">
      <thead><tr><th>商品</th><th>適用機型</th><th>屬性</th><th class="col-w102">數量</th><th class="col-w122">銷售單編號</th><th class="col-w200">退貨原因</th>
        <th v-if="detail.status!=='open'" class="col-w160">處理方式</th><th v-if="canEdit" class="cart-col-remove"></th></tr></thead>
      <tbody><tr v-for="it in detail.items" :key="it.id">
        <td>{{ it.name }}</td><td>{{ modelsText(it) }}</td><td>{{ attrText(it) }}</td>
        <td><input type="number" v-model.number="it.qty" min="1" class="w80"
                   :disabled="!canEdit" @change="setQty(it)"></td>
        <td><input v-if="canEdit" v-model="it.sale_id" class="w100" placeholder="選填"
                   @change="setSale(it)"><template v-else>{{ it.sale_id ?? '' }}</template></td>
        <td><input v-if="canEdit" v-model="it.reason" maxlength="30" placeholder="選填（30 字內）"
                   @change="setReason(it)"><template v-else>{{ it.reason }}</template></td>
        <td v-if="detail.status!=='open'">
          <select v-if="canReview && detail.kind==='normal'" v-model="it.disposition" @change="setDisposition(it)">
            <option v-for="[key, label] in dispositions" :key="key" :value="key">{{ label }}</option>
          </select><template v-else>{{ dispositionText(it.disposition) }}</template></td>
        <td v-if="canEdit"><button class="btn-x" title="移除" @click="removeItem(it)">✕</button></td>
      </tr></tbody>
    </table>
  </div>
</div>
</template>
<template id="tpl-records">
<div class="page">
  <!-- 紀錄查詢:左側選類別(比照設定頁側欄),右側查詢與清單 -->
  <div class="prod-settings">
    <aside class="cat-list">
      <div class="cat-list-title">紀錄</div>
      <template v-for="[key, label] in shownKinds" :key="key">
        <div v-if="key==='members'" class="cat-list-title cat-list-group">會員</div>
        <div class="cat-item" :class="{active: kind===key}" @click="selectKind(key)">
          <span class="cat-name">{{ label }}</span>
        </div>
      </template>
    </aside>
    <section class="cat-detail records-panel">
      <div v-if="kind==='members'" class="scan-row">
        <input v-model="memberQuery" class="w160" placeholder="名稱或電話" @keydown.enter="reload">
        <button class="primary" @click="reload">查詢</button>
        <button @click="newMember">新增會員</button>
      </div>
      <div v-else-if="kind!=='dayclose'" class="scan-row">
        <label>起 <input type="date" v-model="dateFrom"></label>
        <label>迄 <input type="date" v-model="dateTo"></label>
        <select v-if="kind==='sales'" v-model="payment"><option value="">全部付款方式</option>
          <option v-for="p in payments" :key="p">{{ p }}</option></select>
        <input v-if="kind==='sales'" v-model="memberPhone" class="w120" inputmode="numeric" placeholder="會員電話" @keydown.enter="reload">
        <span v-if="kind==='returns'" class="mode-switch">
          <button type="button" class="chip-toggle" :class="{on: returnKind==='normal'}" @click="selectReturnKind('normal')">一般退貨</button>
          <button type="button" class="chip-toggle" :class="{on: returnKind==='repair'}" @click="selectReturnKind('repair')">返修退貨</button>
        </span>
        <button class="primary" @click="reload">查詢</button>
        <button v-if="kind==='sales' && isAdmin" @click="exportCsv">匯出 CSV</button>
      </div>
      <div v-if="(kind==='sales' && summary) || rowKeys.length" class="records-bar">
        <div v-if="kind==='sales' && summary" class="pay-panel">
          <div>合計 {{ summary.count }} 筆，共 {{ summary.total }} 元<template v-if="summary.void_count">（已作廢 {{ summary.void_count }} 筆 {{ summary.void_total }} 元）</template></div>
          <div class="pay-breakdown"><span v-for="b in summary.by_payment" :key="b.payment">{{ b.payment }}：{{ b.count }} 筆 {{ b.total }} 元</span></div>
        </div>
        <div v-if="rowKeys.length" class="records-bar-actions">
          <button @click="expandAll">展開全部</button>
          <button @click="collapseAll">收合全部</button>
        </div>
      </div>
      <template v-if="kind==='dayclose' && isAdmin">
        <div v-if="dc.preview && dc.preview.unclosed.length" class="notice-bar">
          <span>尚未點帳：</span>
          <button v-for="d in dc.preview.unclosed" :key="d" type="button" class="btn-sm" @click="dcLoad(d)">{{ shortDate(d) }}</button>
          <span v-if="dc.preview.unclosed_count > dc.preview.unclosed.length">（共 {{ dc.preview.unclosed_count }} 個帳日，僅列最近 {{ dc.preview.unclosed.length }} 個）</span>
        </div>
        <div class="scan-row dayclose-row">
          <label>帳日 <input type="date" v-model="dc.date" :max="dc.today" @change="dcLoad()"></label>
          <span v-if="dc.preview">現金銷售 <b>{{ dc.preview.cash_sales }}</b></span>
          <span v-if="dc.preview">預備金 <b>{{ dc.preview.float_amount }}</b></span>
          <span class="dayclose-float">
            <label>預備金設定 <input class="w100" inputmode="numeric" v-model="dc.floatInput" @keydown.enter="dcSaveFloat"></label>
            <button @click="dcSaveFloat">儲存</button>
          </span>
        </div>
        <div v-if="dc.preview" class="pay-breakdown dayclose-breakdown">
          <span v-for="b in dc.preview.by_payment" :key="b.payment">{{ b.payment }}：{{ b.count }} 筆 {{ b.total }} 元</span>
          <span v-if="dc.preview.void_count">已作廢：{{ dc.preview.void_count }} 筆 {{ dc.preview.void_total }} 元</span>
        </div>
        <div v-if="dc.preview && !dc.preview.closed" class="scan-row dayclose-row">
          <label>錢櫃現金總額 <input ref="dcCounted" class="w100" inputmode="numeric" v-model="dc.counted" @keydown.enter="dcClose"></label>
          <span>短溢 <b :class="{neg: dcDiff}">{{ dcDiff === null ? '—' : signedText(dcDiff) }}</b></span>
          <input class="dayclose-reason" v-model="dc.reason" maxlength="60" placeholder="短溢原因（有短溢必填）">
          <employee-picker></employee-picker>
          <button class="primary" :disabled="dc.busy" @click="dcClose">完成點帳</button>
        </div>
        <div v-if="dc.preview && dc.preview.closed" class="scan-row dayclose-row">
          <span class="tag">已點帳</span>
          <span>錢櫃現金總額 <b>{{ dc.preview.record.counted_total }}</b></span>
          <span>短溢 <b :class="{neg: dc.preview.record.diff}">{{ signedText(dc.preview.record.diff) }}</b></span>
          <span v-if="dc.preview.record.reason" class="dayclose-reason-text">原因：{{ dc.preview.record.reason }}</span>
          <span>員工 {{ dc.preview.record.employee }}</span>
          <span>{{ minuteText(dc.preview.record.closed_at) }}</span>
        </div>
        <div class="grp-title">點帳紀錄</div>
        <div class="scan-row">
          <label>起 <input type="date" v-model="dateFrom"></label>
          <label>迄 <input type="date" v-model="dateTo"></label>
          <button class="primary" @click="reload">查詢</button>
        </div>
        <table class="records-table">
          <colgroup><col class="col-w110"><col class="col-w160"><col class="col-w56"><col class="col-w80"><col class="col-w88"><col class="col-w88"><col class="col-w80"><col></colgroup>
          <thead><tr><th>帳日</th><th>點帳時間</th><th>員工</th><th class="num">預備金</th><th class="num">錢櫃總額</th><th class="num">現金銷售</th><th class="num">短溢</th><th>原因</th></tr></thead>
          <tbody>
            <tr v-for="r in dc.records" :key="r.business_date">
              <td>{{ r.business_date }}</td><td>{{ minuteText(r.closed_at) }}</td><td>{{ r.employee }}</td>
              <td class="num">{{ r.float_amount }}</td><td class="num">{{ r.counted_total }}</td><td class="num">{{ r.cash_sales }}</td>
              <td class="num" :class="{neg: r.diff}">{{ signedText(r.diff) }}</td><td>{{ r.reason || '—' }}</td>
            </tr>
          </tbody>
        </table>
      </template>
      <table v-if="kind==='sales'" class="records-table">
        <colgroup><col class="col-w80"><col class="col-w240"><col class="col-w56"><col><col class="col-w80"><col class="col-w80"><col class="col-w88"><col class="col-w92"></colgroup>
        <thead><tr><th>編號</th><th>時間</th><th>員工</th><th>付款</th><th class="num">整單折抵</th><th class="num">會員折扣</th><th class="num">應收</th><th></th></tr></thead>
        <tbody>
          <template v-for="s in sales" :key="s.sale_id">
            <tr :class="{'sale-void': s.voided_at}">
              <td>{{ s.sale_id }}</td><td>{{ minuteText(s.ts) }}<span v-if="s.voided_at" class="tag records-tag">已作廢</span><span v-if="!s.voided_at && nextDayBook(s)" class="tag records-tag">計入次日帳</span></td><td>{{ s.employee }}</td><td>{{ s.payment }}</td>
              <td class="num">{{ amountText(s.order_discount) }}</td><td class="num">{{ amountText(s.member_discount) }}</td>
              <td class="num records-total">{{ s.total }}</td>
              <td class="records-action"><button class="records-toggle" :class="{on: isOpen(s.sale_id)}" :aria-expanded="isOpen(s.sale_id)" @click="toggle(s.sale_id)">{{ s.items.length }} 項 {{ isOpen(s.sale_id) ? '▴' : '▾' }}</button></td>
            </tr>
            <tr v-if="isOpen(s.sale_id)"><td colspan="8" class="records-detail-cell">
              <div v-if="s.member_name" class="records-member">會員：{{ s.member_name }} {{ s.member_phones || '' }}</div>
              <div v-if="s.voided_at" class="records-member">已作廢：{{ minuteText(s.voided_at) }}　原因：{{ s.void_reason }}　帳日 {{ s.business_date }}</div>
              <table class="records-detail">
                <colgroup><col><col class="col-w56"><col class="col-w72"><col class="col-w64"><col class="col-w72"></colgroup>
                <thead><tr><th>商品</th><th class="num">數量</th><th class="num">原價</th><th class="num">實售價</th><th class="num">小計</th></tr></thead>
                <tbody><tr v-for="it in s.items">
                  <td>{{ it.name }} <span class="records-spec">{{ specText(it) }}</span></td>
                  <td class="num">{{ it.qty }}</td><td class="num">{{ it.unit_price }}</td><td class="num">{{ salePrice(it) }}</td>
                  <td class="num">{{ it.qty * it.unit_price - it.discount }}</td>
                </tr></tbody>
                <tfoot><tr><td colspan="5" class="records-formula">{{ formulaText(s) }}</td></tr></tfoot>
              </table>
              <div v-for="c in (s.corrections || [])" class="records-member">更正　{{ correctionText(c) }}</div>
              <div v-if="isAdmin" class="records-ops">
                <button v-if="!s.voided_at && !s.day_closed" class="btn-sm convert" @click="openVoid(s)">作廢</button>
                <button v-if="!s.voided_at && !s.day_closed" class="btn-sm subtle" @click="openCorrect('payment', 'sale', s)">更正付款方式</button>
                <button class="btn-sm subtle" @click="openCorrect('employee', 'sale', s)">修正操作者</button>
              </div>
            </td></tr>
          </template>
        </tbody>
      </table>
      <table v-else-if="kind==='receive'" class="records-table">
        <colgroup><col class="col-w180"><col><col class="col-w92"></colgroup>
        <thead><tr><th>時間</th><th>員工</th><th></th></tr></thead>
        <tbody>
          <template v-for="r in receipts" :key="r.receipt_id">
            <tr>
              <td>{{ r.ts }}</td><td>{{ r.employee ?? '—' }}</td>
              <td class="records-action"><button class="records-toggle" :class="{on: isOpen(r.receipt_id)}" :aria-expanded="isOpen(r.receipt_id)" @click="toggle(r.receipt_id)">{{ r.items.length }} 項 {{ isOpen(r.receipt_id) ? '▴' : '▾' }}</button></td>
            </tr>
            <tr v-if="isOpen(r.receipt_id)"><td colspan="3" class="records-detail-cell">
              <table class="records-detail">
                <colgroup><col><col class="col-w88"><col class="col-w88"></colgroup>
                <thead><tr><th>商品</th><th class="num">進貨數量</th><th class="num">目前庫存</th></tr></thead>
                <tbody><tr v-for="it in r.items">
                  <td>{{ it.name }} <span class="records-spec">{{ specText(it) }}</span></td>
                  <td class="num">{{ it.qty }}</td><td class="num">{{ it.stock }}</td>
                </tr></tbody>
              </table>
              <div v-for="c in (r.corrections || [])" class="records-member">更正　{{ correctionText(c) }}</div>
              <div v-if="isAdmin" class="records-ops">
                <button class="btn-sm subtle" @click="openCorrect('employee', 'receipt', r)">修正操作者</button>
              </div>
            </td></tr>
          </template>
        </tbody>
      </table>
      <table v-else-if="kind==='returns'" class="records-table">
        <colgroup><col class="col-w80"><col class="col-w180"><col><col class="col-w180"><col class="col-w56"><col class="col-w92"></colgroup>
        <thead><tr><th>單號</th><th>開單時間</th><th>狀態</th><th>{{ returnKind==='repair' ? '核准／完成時間' : '核准時間' }}</th><th>員工</th><th></th></tr></thead>
        <tbody>
          <template v-for="t in returns" :key="t.return_id">
            <tr>
              <td>{{ t.return_id }}</td><td>{{ t.started_at }}</td>
              <td>{{ returnSheetStatus(t) }}</td>
              <td>{{ t.completed_at || t.approved_at || '—' }}</td><td>{{ t.employee }}</td>
              <td class="records-action"><button class="records-toggle" :class="{on: isOpen(t.return_id)}" :aria-expanded="isOpen(t.return_id)" @click="toggle(t.return_id)">{{ t.items.length }} 項 {{ isOpen(t.return_id) ? '▴' : '▾' }}</button></td>
            </tr>
            <tr v-if="isOpen(t.return_id)"><td colspan="6" class="records-detail-cell">
              <div v-if="returnKind==='repair'" class="repair-cards">
                <div v-for="it in t.items" :key="it.id" class="repair-card">
                  <div class="repair-card-head">
                    <div class="repair-card-title"><div class="repair-card-name">{{ it.name }}</div>
                      <div class="repair-card-spec">{{ repairSpecText(it) }}</div></div>
                    <div class="repair-card-counts"><span>數量 <b>{{ it.qty }}</b></span>
                      <span class="repair-count-done">已返新 <b>{{ it.repaired_qty }}</b></span>
                      <span v-if="repairLeft(it)" class="repair-count-left">待返新 <b>{{ repairLeft(it) }}</b></span>
                      <span v-if="it.closed_qty" class="repair-count-closed">已結案 <b>{{ it.closed_qty }}</b></span>
                      <span v-if="!repairLeft(it) && !it.closed_qty"></span></div>
                    <span class="repair-state" :class="'repair-state-' + repairState(it)">{{ repairStateText(it) }}</span>
                  </div>
                  <div v-if="it.reason || it.closed_qty" class="repair-card-notes">
                    <div v-if="it.reason"><span class="repair-note-label">退貨原因</span>{{ it.reason }}</div>
                    <div v-if="it.closed_qty"><span class="repair-note-label">結案理由</span>{{ it.closed_reason }}</div>
                    <div v-if="it.closed_qty" class="repair-note-date">{{ String(it.closed_at || '').slice(0, 10) }} 結案</div>
                  </div>
                  <div v-if="isAdmin && (it.closed_qty || (t.status==='repairing' && repairLeft(it)))" class="repair-card-actions">
                    <button v-if="it.closed_qty" class="btn-sm subtle" @click="reopenRepairItem(t, it)">撤回結案</button>
                    <button v-else class="btn-sm convert" @click="closeRepairItem(t, it)">結案</button>
                  </div>
                </div>
              </div>
              <table v-else class="records-detail">
                <colgroup><col><col class="col-w56"><col class="col-w72"><col class="col-w96"><col class="col-w130"></colgroup>
                <thead><tr><th>商品</th><th class="num">數量</th><th class="num">銷售單</th><th>處理方式</th><th>原因</th></tr></thead>
                <tbody><tr v-for="it in t.items">
                  <td>{{ it.name }} <span class="records-spec">{{ specText(it) }}</span></td>
                  <td class="num">{{ it.qty }}</td><td class="num">{{ it.sale_id || '—' }}</td>
                  <td>{{ ['open','pending'].includes(t.status) ? '—' : dispositionText(it.disposition) }}</td><td>{{ it.reason || '—' }}</td>
                </tr></tbody>
              </table>
              <div v-for="c in (t.corrections || [])" class="records-member">更正　{{ correctionText(c) }}</div>
              <div v-if="isAdmin" class="records-ops">
                <button class="btn-sm subtle" @click="openCorrect('employee', 'return', t)">修正操作者</button>
              </div>
            </td></tr>
          </template>
        </tbody>
      </table>
      <table v-else-if="kind==='stocktake'" class="records-table">
        <colgroup><col class="col-w80"><col class="col-w180"><col><col class="col-w180"><col class="col-w56"><col class="col-w88"><col class="col-w92"></colgroup>
        <thead><tr><th>單號</th><th>開始時間</th><th>狀態</th><th>核准／作廢時間</th><th>員工</th><th class="num">差異項數</th><th></th></tr></thead>
        <tbody>
          <template v-for="t in stocktakes" :key="t.session_id">
            <tr>
              <td>{{ t.session_id }}</td><td>{{ t.started_at }}</td>
              <td>{{ t.status==='cancelled' ? '已作廢（員工 ' + t.cancelled_by + '）' : '已核准' }}</td>
              <td>{{ t.approved_at || t.cancelled_at }}</td><td>{{ t.employee }}</td><td class="num">{{ t.diff_count }}</td>
              <td class="records-action"><button class="records-toggle" :class="{on: isOpen(t.session_id)}" :aria-expanded="isOpen(t.session_id)" @click="toggle(t.session_id)">{{ t.items.length }} 項 {{ isOpen(t.session_id) ? '▴' : '▾' }}</button></td>
            </tr>
            <tr v-if="isOpen(t.session_id)"><td colspan="7" class="records-detail-cell">
              <table class="records-detail">
                <colgroup><col><col class="col-w56"><col class="col-w56"><col class="col-w56"><col class="col-w130"></colgroup>
                <thead><tr><th>商品</th><th class="num">系統</th><th class="num">實盤</th><th class="num">差異</th><th>原因</th></tr></thead>
                <tbody><tr v-for="it in t.items">
                  <td>{{ it.name }} <span class="records-spec">{{ specText(it) }}</span></td>
                  <td class="num">{{ it.system_qty }}</td><td class="num">{{ it.counted_qty }}</td>
                  <td class="num">{{ it.diff > 0 ? '+' + it.diff : it.diff }}</td><td>{{ it.note || '—' }}</td>
                </tr></tbody>
              </table>
              <div v-for="c in (t.corrections || [])" class="records-member">更正　{{ correctionText(c) }}</div>
              <div v-if="isAdmin" class="records-ops">
                <button class="btn-sm subtle" @click="openCorrect('employee', 'stocktake', t)">修正操作者</button>
              </div>
            </td></tr>
          </template>
        </tbody>
      </table>
      <table v-if="kind==='members'" class="records-table">
        <colgroup><col><col><col class="col-w130"><col class="col-w130"></colgroup>
        <thead><tr><th>名稱</th><th>電話</th><th>建立日期</th><th></th></tr></thead>
        <tbody>
          <tr v-for="m in members" :key="m.member_id">
            <td>{{ m.name }}</td><td>{{ phonesText(m) }}</td><td>{{ m.ts.slice(0, 10) }}</td>
            <td class="records-action"><button class="btn-sm" @click="editMember(m)">修改</button>
              <button v-if="isAdmin" class="btn-sm danger" @click="removeMember(m)">刪除</button></td>
          </tr>
          <tr v-if="!members.length"><td colspan="4" class="dialog-hint">查無會員</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <!-- 會員新增／修改(單層) -->
  <member-editor v-if="memberPopup" :member="memberPopup" @close="memberEditorClosed"></member-editor>
  <doc-correct v-if="correct" :mode="correct.mode" :doc="correct.doc" :payments="payments" @close="correctClosed"></doc-correct>
</div>
</template>
    </tbody>
  </table>
</div>
</template>
<template id="tpl-catalog">
<div class="page">
  <div class="catalog-card" :class="{'catalog-staff': !isAdmin}">
  <div class="scan-row catalog-filter-row">
    <select v-model="fCategory" @change="onCategoryChange">
      <option :value="null">全部種類</option>
      <option v-for="c in categories" :key="c.category_id" :value="c.category_id">{{ c.name }}</option>
    </select>
    <select v-model="fBrand" @change="reload">
      <option :value="null">全部廠牌</option>
      <option v-for="b in brands" :key="b.brand_id" :value="b.brand_id">{{ b.name }}</option>
    </select>
    <select v-model="fModel" @change="reload">
      <option :value="null">全部型號</option>
      <option v-for="m in models" :key="m.model_id" :value="m.model_id">{{ modelLabel(m) }}</option>
    </select>
    <input v-model="q" @keyup.enter="reload" class="catalog-search-input"
           placeholder="搜尋名稱、規格或條碼">
    <button class="primary" @click="reload">查詢</button>
    <label class="chk"><input type="checkbox" v-model="includeInactive" @change="reload"> 顯示已停用</label>
    <label v-if="isAdmin" class="chk"><input type="checkbox" v-model="pending" @change="reload"> 待處理<span v-if="pendingCount" class="badge">{{ pendingCount }}</span></label>
    <button v-if="isAdmin" class="catalog-add-btn" @click="openAddVariant(null)">新增</button>
  </div>
  <div class="catalog-table-scroll">
  <table class="sub catalog-table">
    <colgroup>
      <col class="catalog-col-model">
      <col class="catalog-col-spec">
      <col class="catalog-col-stock">
      <col class="catalog-col-barcode">
      <col class="catalog-col-price">
      <col class="catalog-col-status">
      <col v-if="isAdmin" class="catalog-col-actions">
    </colgroup>
    <thead><tr><th>型號</th><th>規格</th><th>庫存</th><th>條碼</th>
      <th>售價</th><th>狀態</th><th v-if="isAdmin">操作</th></tr></thead>
    <tbody>
      <template v-for="p in displayProducts" :key="p.product_id">
        <tr class="catalog-product-row" :class="{inactive: !p.active}">
          <td colspan="5" class="catalog-product-info">
            <strong>{{ p.name }}</strong>
            <span v-if="!p.active" class="catalog-inactive-badge">已停用</span>
            <button v-if="isAdmin && p.active" class="btn-sm" @click="openAddVariant(p)">新增款式</button>
          </td>
          <td :colspan="isAdmin ? 2 : 1" class="catalog-product-actions">
            <button v-if="isAdmin" class="btn-sm" @click="editInSettings(p)">修改規格</button>
            <button v-if="isAdmin" class="btn-sm" @click="toggleProductActive(p)">{{ p.active ? '停用' : '啟用' }}</button>
            <button v-if="isAdmin" class="btn-sm" @click="deleteProduct(p)">刪除</button>
          </td>
        </tr>
        <tr v-for="{ v, showModel, rowspan } in groupedVariants(p)" :key="v.variant_id"
            class="catalog-variant-row" :class="{inactive: !v.active}">
          <td v-if="showModel" :rowspan="rowspan" class="catalog-model-cell">
            <template v-if="modelLines(p, v).length"><div v-for="(m, mi) in modelLines(p, v)" :key="mi"
                 class="catalog-model-line">{{ m }}{{ mi === modelLines(p, v).length - 1 ? '' : '、' }}</div></template>
            <template v-else>—</template>
          </td>
          <td>
            {{ attrText(v, '（無規格）') }}
            <div v-if="v.issues && v.issues.length" class="issue-box">
              <div class="issue-tag">待處理</div>
              <div v-for="(it, ii) in v.issues" :key="ii" class="issue-line">{{ issueText(it) }}</div>
            </div>
          </td>
          <td :class="{neg: v.stock < 0}">{{ v.stock }}</td>
          <td>
            <span v-if="mainBarcode(v)" class="bc-line">
              <span class="bc-number" :title="mainBarcode(v).barcode">{{ mainBarcode(v).barcode }}</span><span class="bc-tag">{{ mainBarcode(v).source === 'store' ? '(自)' : '' }}</span>
              <button v-if="v.active && !(v.issues && v.issues.length)"
                      class="btn-sm" @click="printLabel(p, v)">印標籤</button>
            </span>
            <button v-else-if="isAdmin" class="btn-sm" @click="openVariantEditor(p, v)">管理</button>
            <div v-for="b in otherBarcodes(v)" :key="b.barcode" class="bc-line">
              <span class="bc-number" :title="b.barcode">{{ b.barcode }}</span><span class="bc-tag">{{ b.source === 'store' ? '(自)' : '' }}</span>
            </div>
          </td>
          <td>{{ v.price === null ? '未定價' : v.price }}</td>
          <td>{{ v.issues && v.issues.length ? '待處理' : (v.active ? '啟用' : '已停用') }}</td>
          <td v-if="isAdmin">
            <template v-if="isAdmin && v.issues && v.issues.length">
              <button class="btn-sm" @click="openVariantEditor(p, v)">編輯</button>
              <button class="btn-sm" @click="deleteVariant(p, v)">刪除</button>
            </template>
            <template v-else-if="isAdmin">
              <button class="btn-sm" @click="openVariantEditor(p, v)">編輯</button>
              <button class="btn-sm" @click="toggleVariantActive(p, v)">{{ v.active ? '停用' : '啟用' }}</button>
              <button class="btn-sm" @click="deleteVariant(p, v)">刪除</button>
            </template>
          </td>
        </tr>
      </template>
    </tbody>
  </table>
  </div>
  <div v-if="displayVariantCount === 0 && inactiveMatchCount > 0" class="done-msg catalog-empty-result">
    查無啟用中的商品；另有 {{ inactiveMatchCount }} 筆已停用的商品資料符合條件。
    <button @click="showInactiveResults">顯示已停用</button>
  </div>
  <div v-else-if="displayVariantCount === 0 && !inactiveLookupFailed &&
                  (includeInactive || inactiveMatchCount === 0)"
       class="done-msg catalog-empty-result">
    {{ isAdmin ? '查無符合的商品，請確認關鍵字或至設定新增。' : '查無符合的商品，請確認關鍵字。' }}
  </div>
  </div>
</div>
</template>
<template id="tpl-settings">
<div class="page">

  <!-- 商品設定:左種類清單、右種類內容 -->

      <div class="cat-item" :class="{active: section==='password'}"

      </div>
    </aside>

    <section class="cat-detail" v-if="section==='category' && selectedCat">
      <div class="detail-head">
        <input class="name cat-title" v-model="selectedCat.name"
               @keyup.enter="saveCategoryName(selectedCat)">
        <button class="btn-sm" @click="saveCategoryName(selectedCat)">儲存名稱</button>
        <button class="btn-sm" @click="toggleCategoryActive(selectedCat)">
          {{ selectedCat.active ? '停用' : '啟用' }}</button>
        <button class="btn-sm danger" @click="deleteCategory(selectedCat)">刪除</button>
      </div>

      <!-- 規格平常收成一行摘要(只列啟用中的),要改才展開;產品表格才是常用區 -->
      <div class="spec-head">
        <span class="grp-title">規格項目</span>
        <span v-if="!specEditing" class="spec-tags">
          <span class="tag" v-for="f in activeSpecRows" :key="f.field_id">
            {{ f.name }}<template v-if="f.field_type==='multi'">（複選）</template></span>
          <span v-if="!activeSpecRows.length" class="hint">尚未啟用任何規格</span>
        </span>
        <button class="btn-sm spec-toggle" @click="specEditing = !specEditing">
          {{ specEditing ? '完成' : '編輯規格' }}</button>
      </div>
      <div v-if="pageError && errorScope==='category'" class="error-bar section-bar">⚠ {{ pageError }}</div>
      <template v-if="specEditing">
      <small class="hint spec-hint">可新增、修改、刪除規格</small>
      <div class="inline-add add-before-list">
        <input v-model="newField.name" placeholder="新規格名稱"
               @keyup.enter="addTemplateField">
        <select v-model="newField.field_type">
          <option value="select">下拉選單</option>
          <option value="text">文字</option>
          <option value="multi">複選</option>
        </select>
        <button class="primary" @click="addTemplateField">新增</button>
      </div>
      <!-- 固定項目(適用機型、特性詞條):名稱與型態以純文字呈現,只留啟用開關 -->
      <div class="maint-row fixed-row" v-for="f in fixedRows" :key="f.field_id">
        <span class="fixed-name name">{{ f.name }}</span>
        <button class="switch" type="button" role="switch"
                :class="{on: !!f.active}" :aria-checked="!!f.active"
                @click.stop="toggleFixedRow(f)"><span class="knob"></span></button>
        <span class="switch-label">{{ f.active ? '啟用' : '停用' }}</span>
      </div>
      <sortable-list :items="customRows" item-key="field_id" active-key="active"
                     :auto-save="true" @save="saveFieldSort">
        <template #row="{ item: f }">
          <input class="name" v-model="f.name"
                 @keyup.enter="saveFieldName(f)" @blur="saveFieldName(f)">
          <select :value="f.field_type" @change="setFieldType(f, $event.target.value)">
            <option value="select">下拉選單</option>
            <option value="text">文字</option>
            <option value="multi">複選</option>
          </select>
          <button class="btn-sm" :class="{invisible: !hasOptions(f)}"
                  :tabindex="hasOptions(f) ? 0 : -1"
                  @click.stop="hasOptions(f) && openFieldPopup(f)">✎ 選項</button>
          <button class="chip-toggle" type="button" :class="{on: !!f.required}"
                  :aria-pressed="!!f.required" title="切換必填／選填"
                  @click.stop="setFieldRequired(f, !f.required)">
            {{ f.required ? '必填' : '選填' }}</button>
          <button class="btn-x" title="刪除規格" @click.stop="deleteTemplateField(f)">✕</button>
          <button class="switch" type="button" role="switch"
                  :class="{on: !!f.active}" :aria-checked="!!f.active"
                  @click.stop="setFieldActive(f, !f.active)"><span class="knob"></span></button>
          <span class="switch-label">{{ f.active ? '啟用' : '停用' }}</span>
        </template>
      </sortable-list>
      </template>

      <div class="card-head prod-head">
        <span class="grp-title">本商品種類產品</span>
        <button class="primary" @click="openProductPopup(null)">加入廠牌(供應商)</button>
      </div>
      <table class="big-prod">
        <thead><tr><th>名稱</th><th>廠牌</th><th>子產品</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody>
          <tr v-for="p in bigProducts" :key="p.product_id" :class="{inactive: !p.active}">
            <td>{{ p.name }}</td>
            <td>{{ p.brand_name || '—' }}</td>
            <td>{{ p.variants.length }}</td>
            <td>{{ p.active ? '啟用' : '已停用' }}</td>
            <td>
              <button class="btn-sm" @click="openProductPopup(p)">修改</button>
              <button class="btn-sm" @click="toggleProductActive(p)">
                {{ p.active ? '停用' : '啟用' }}</button>
              <button class="btn-sm danger" @click="deleteProduct(p)">刪除</button>
            </td>
          </tr>
          <tr v-if="!bigProducts.length"><td colspan="5" class="hint">此種類尚無產品。</td></tr>
        </tbody>
      </table>
    </section>
    <section class="cat-detail" v-else-if="section==='category'">
      <div class="hint">請於左側選擇或新增商品種類。</div>
    </section>

    <section class="cat-detail" v-else-if="section==='password'">
      <div class="card-head"><h3>管理者密碼</h3></div>
      <div v-if="pageError && errorScope==='password'" class="error-bar section-bar">⚠ {{ pageError }}</div>
      <div class="create-form">
        <label>舊密碼 <input type="password" v-model="passwordForm.old" autocomplete="current-password"></label>
        <label>新密碼 <input type="password" v-model="passwordForm.next" autocomplete="new-password"></label>
        <label>確認新密碼 <input type="password" v-model="passwordForm.confirm" autocomplete="new-password"></label>
        <button type="button" class="primary" @click="changePassword">變更密碼</button>
      </div>
    </section>

    <!-- 基礎資料:廠牌 -->
    <section class="cat-detail" v-else-if="section==='brands'">
      <div class="card-head"><h3>廠牌(供應商)</h3>
        <span class="card-actions">
          <button v-if="hasUnsaved('brands')" @click="revertAll('brands')">復原</button>
          <button class="primary" @click="saveAll('brands')">儲存修改</button>
        </span></div>
      <div v-if="hasUnsaved('brands')" class="notice-bar">
        ⚠ 有未儲存的修改，調整順序或修改名稱後請按「儲存修改」</div>
      <div v-if="pageError && errorScope==='brands'" class="error-bar section-bar">⚠ {{ pageError }}</div>
      <div class="inline-add add-before-list">
        <input class="w60" v-model="newSeq.brands" placeholder="排序">
        <input v-model="newItem.brands" placeholder="新廠牌名稱" @keyup.enter="addItem('brands')">
        <button class="primary" @click="addItem('brands')">新增</button>
      </div>
      <sortable-list :items="brands" item-key="brand_id"
                     @pending="onSortPending('brands', $event)">
        <template #row="{ item: b }">
          <input class="name" v-model="b.name">
          <button @click="deleteItem('brands', b)">刪除</button>
          <button @click="openBrandEditor(b)">{{ openBrand===b.brand_id ? '收合' : '配件種類' }}</button>
        </template>
        <template #detail="{ item: b }">
          <div v-if="openBrand === b.brand_id" class="detail-panel maint-detail">
            <div class="step-title">「{{ openBrandName }}」經營的配件種類</div>
            <small class="hint">勾選後,建檔時選到該種類才會出現此廠牌。</small>
            <label v-for="c in categories" :key="c.category_id" class="chk">
              <input type="checkbox" :checked="brandCatChecked[c.category_id]"
                     @change="toggleBrandCat(c)"> {{ c.name }}
            </label>
          </div>
        </template>
      </sortable-list>
    </section>

    <!-- 基礎資料:適用機型(裝置類型、機型品牌、型號) -->
    <section class="cat-detail" v-else-if="section==='models'">
      <!-- 平常收成一行摘要(只列啟用中的),要改才展開 -->
      <div class="spec-head">
        <h3 class="spec-title">裝置類型</h3>
        <span v-if="!editDeviceTypes" class="spec-tags">
          <span class="tag" v-for="x in deviceTypes.filter(x => x.active)" :key="x.device_type_id">{{ x.name }}</span>
          <span v-if="!deviceTypes.some(x => x.active)" class="hint">尚無啟用中的裝置類型</span>
        </span>
        <button class="btn-sm spec-toggle" @click="editDeviceTypes = !editDeviceTypes">
          {{ editDeviceTypes ? '完成' : '編輯裝置類型' }}</button>
      </div>
      <div v-if="pageError && errorScope==='deviceTypes'" class="error-bar section-bar">⚠ {{ pageError }}</div>
      <template v-if="editDeviceTypes">
      <div class="inline-add add-before-list">
        <input class="w60" v-model="newSeq.deviceTypes" placeholder="排序">
        <input v-model="newItem.deviceTypes" placeholder="新裝置類型名稱(如 平板)"
               @keyup.enter="addItem('deviceTypes')">
        <button class="primary" @click="addItem('deviceTypes')">新增</button>
      </div>
      <sortable-list :items="deviceTypes" item-key="device_type_id" :auto-save="true"
                     @save="saveSort('deviceTypes', $event)">
        <template #row="{ item: dt }">
          <input class="name" v-model="dt.name"
                 @keyup.enter="saveItemName('deviceTypes', dt)"
                 @blur="saveItemName('deviceTypes', dt)">
          <button @click="toggleActive('deviceTypes', dt)">{{ dt.active ? '停用' : '啟用' }}</button>
          <button @click="deleteItem('deviceTypes', dt)">刪除</button>
        </template>
      </sortable-list>
      </template>

      <!-- 平常收成一行摘要(只列啟用中的),要改才展開 -->
      <div class="spec-head">
        <h3 class="spec-title">機型品牌</h3>
        <span v-if="!editPhoneBrands" class="spec-tags">
          <span class="tag" v-for="x in phoneBrands.filter(x => x.active)" :key="x.phone_brand_id">{{ x.name }}</span>
          <span v-if="!phoneBrands.some(x => x.active)" class="hint">尚無啟用中的機型品牌</span>

        <button class="btn-sm spec-toggle" @click="editPhoneBrands = !editPhoneBrands">
          {{ editPhoneBrands ? '完成' : '編輯機型品牌' }}</button>
      </div>
      <div v-if="pageError && errorScope==='phoneBrands'" class="error-bar section-bar">⚠ {{ pageError }}</div>
      <template v-if="editPhoneBrands">
      <div class="inline-add add-before-list">
        <input class="w60" v-model="newSeq.phoneBrands" placeholder="排序">
        <input v-model="newItem.phoneBrands" placeholder="新機型品牌名稱(如 Apple)"
               @keyup.enter="addItem('phoneBrands')">
        <button class="primary" @click="addItem('phoneBrands')">新增</button>
      </div>
      <sortable-list :items="phoneBrands" item-key="phone_brand_id" :auto-save="true"
                     @save="saveSort('phoneBrands', $event)">
        <template #row="{ item: pb }">
          <input class="name" v-model="pb.name"
                 @keyup.enter="saveItemName('phoneBrands', pb)"
                 @blur="saveItemName('phoneBrands', pb)">
          <button @click="toggleActive('phoneBrands', pb)">{{ pb.active ? '停用' : '啟用' }}</button>
          <button @click="deleteItem('phoneBrands', pb)">刪除</button>
        </template>
      </sortable-list>

      <div class="card-head" style="margin-top:16px"><h3>型號</h3>

          <button v-if="hasUnsaved('models')" @click="revertAll('models')">復原</button>

        </span></div>
      <div v-if="hasUnsaved('models')" class="notice-bar">

          <option :value="null">選擇機型品牌</option>
          <option v-for="pb in phoneBrands" :key="pb.phone_brand_id"
                  :value="pb.phone_brand_id">{{ pb.name }}</option>
        </select>
        <input class="w60" v-model="newSeq.models" placeholder="排序">
        <input v-model="newModel.name" placeholder="型號名稱" @keyup.enter="addModel">
        <select v-model.number="newModel.device_type_id">
          <option :value="null">選擇裝置類型</option>
          <option v-for="dt in deviceTypes" :key="dt.device_type_id"
                  :value="dt.device_type_id">{{ dt.name }}</option>
        </select>
        <button class="primary" @click="addModel">新增</button>
      </div>
      <div class="inline-add add-before-list model-search">
        <span class="search-label">快速搜尋</span>
        <input v-model="modelQuery" placeholder="搜尋型號、別名或裝置類型">
        <button v-if="modelQuery" @click="modelQuery = ''">清除</button>
        <span v-if="modelQuery" class="hint">搜尋中不可調整順序</span>
      </div>
      <!-- 品牌排成一列當開關,點了在下方展開該品牌型號(一次一個,點別的會收起目前的) -->
      <div class="chip-wrap brand-bar">
        <button v-for="g in modelGroups" :key="'bar-' + g.brand" type="button"
                class="chip-toggle" :class="{on: isBrandOpen(g.brand)}"
                :aria-pressed="isBrandOpen(g.brand)" @click="toggleBrand(g.brand)">
          {{ g.brand }}（{{ g.items.length }}）</button>
      </div>
      <div v-for="g in modelGroups" :key="g.brand" class="model-group">
        <div v-if="isBrandOpen(g.brand)" class="grp-title model-group-head">{{ g.brand }}</div>
        <transition name="collapse">
        <sortable-list v-if="isBrandOpen(g.brand)" :items="g.items" item-key="model_id"
                       :disabled="!!modelQuery.trim()"
                       @pending="onModelSortPending(g.brand, $event)">
          <template #row="{ item: m }">
            <input class="name" v-model="m.name">
            <input class="w120" v-model="m.alias" placeholder="別名(選填)">
            <select v-model.number="m.device_type_id" title="裝置類型">
              <option v-for="dt in deviceTypes" :key="dt.device_type_id"
                      :value="dt.device_type_id">{{ dt.name }}</option>
            </select>
            <button @click="toggleActive('models', m)">{{ m.active ? '停用' : '啟用' }}</button>
            <button @click="deleteItem('models', m)">刪除</button>
          </template>
        </sortable-list>
        </transition>
      </div>
    </section>
  </div>

  <!-- 產品 popup(單層) -->
  <div v-if="prodPopup" class="modal-overlay" @click.self="prodPopup=null">
    <div class="modal">
      <h3>{{ prodPopup.mode==='new' ? '新增產品' : '修改產品' }}</h3>
      <label>廠牌
        <combo-box :model-value="prodPopup.brandQuery" :options="brands"
                   option-key="brand_id" option-label="name" :autofocus="true"
                   placeholder="搜尋或輸入廠牌" :allow-create="true" empty-text="尚無廠牌"
                   @update:model-value="onBrandQueryInput"
                   @select="pickBrand" @create="addInlineBrand"></combo-box>
      </label>
      <div v-if="prodPopup.brand_name" class="field-note">
        將一併建立新廠牌「{{ prodPopup.brand_name }}」</div>
      <label>名稱 <input v-model="prodPopup.name" @input="onProdNameInput"></label>
      <div v-if="autoNameActive" class="field-note">已依廠牌自動命名，可自行修改</div>
      <div v-else-if="canRestoreAutoName" class="field-note">
        <span class="link" role="button" @click="restoreAutoName">重新自動命名</span></div>
      <label>備註 <input v-model="prodPopup.note" placeholder="選填"></label>
      <label v-if="prodPopup.mode==='edit'">狀態
        <select v-model="prodPopup.active">
          <option :value="true">啟用</option>
          <option :value="false">停用</option>
        </select>
      </label>
      <div class="modal-actions">
        <span v-if="duplicateNameWarning" class="modal-warn">{{ duplicateNameWarning }}</span>
        <button class="primary" @click="saveProduct">儲存</button>
        <button @click="prodPopup=null">取消</button>
      </div>
    </div>
  </div>


</div>
