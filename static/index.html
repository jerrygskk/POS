<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS</title>
<link rel="stylesheet" href="css/pos.css?v=241">
</head>
<body>
<div id="app">
  <nav :class="{admin: auth.isAdmin}">
    <img class="nav-logo" src="img/logo.png?v=241" alt="膜型機品牌標誌">
    <button v-for="[key, label] in pages" :key="key"
            :class="{active: page===key}" @click="goPage(key)">{{ label }}<span
              v-if="key==='stocktake' && auth.isAdmin && auth.pendingStocktakes > 0"
              class="badge">{{ auth.pendingStocktakes }}</span></button>
    <button style="margin-left:auto; white-space:nowrap" @click="toggleAdmin"><span
      v-if="auth.isAdmin" class="badge">管理者</span>{{ auth.isAdmin ? '登出管理者' : '管理者登入' }}</button>
  </nav>
  <div class="error-bar" v-if="error">⚠ {{ error }}</div>
  <component :is="'page-' + page"></component>
</div>
<!-- 各頁模板集中於此,由各 js 以 template: '#tpl-xxx' 引用 -->
<template id="tpl-checkout">
<div class="page checkout">
  <div class="scan-row"><employee-picker></employee-picker></div>
  <div class="scan-row">
    <input ref="scan" v-model="scanCode" @keyup.enter="onScan"
           placeholder="掃描條碼或輸入後按 Enter" class="scan-input" autofocus>
    <input v-model="searchQ" @keyup.enter="onSearch" placeholder="關鍵字搜尋商品">
  </div>
  <div v-if="searchResults.length" class="search-pop">
    <div v-for="r in searchResults" :key="r.variant_id" class="search-item"
         @click="addItem(r)">
      {{ r.name }}|{{ attrText(r) }}|
      {{ r.price === null ? '未定價' : r.price + ' 元' }}|庫存 {{ r.stock }}
    </div>
  </div>
  <table class="cart-table">
    <colgroup>
      <col class="cart-col-barcode">
      <col><col>
      <col class="cart-col-price"><col class="cart-col-qty"><col class="cart-col-discount">
      <col class="cart-col-subtotal"><col class="cart-col-stock"><col class="cart-col-remove">
    </colgroup>
    <thead><tr><th>條碼</th><th>商品</th><th>屬性</th><th>單價</th><th>數量</th>
      <th>單品折扣</th><th>小計</th><th>目前庫存</th><th></th></tr></thead>
    <tbody>
      <tr v-for="(it, i) in draft.cart" :key="it.variant_id">
        <td>{{ it.label_barcode || '—' }}</td>
        <td>{{ it.name }}</td>
        <td>{{ attrText(it) }}</td>
        <td><input type="number" v-model.number="it.unit_price" min="0" class="w80" :disabled="draft.submitting"></td>
        <td><input type="number" v-model.number="it.qty" min="1" class="w60" :disabled="draft.submitting"
                   @change="it.qty = Math.max(1, Math.floor(it.qty) || 1)"></td>
        <td><input type="number" v-model.number="it.discount" min="0" class="w80" :disabled="draft.submitting"></td>
        <td>{{ it.qty * it.unit_price - it.discount }}</td>
        <td :class="{neg: it.qty > it.stock}">{{ it.stock }}</td>
        <td><button class="btn-x" title="移除" @click="removeItem(i)" :disabled="draft.submitting">✕</button></td>
      </tr>
    </tbody>
  </table>
  <div class="pay-panel">
    <label>整單折抵 <input type="number" v-model.number="draft.orderDiscount" min="0" class="w80" :disabled="draft.submitting"></label>
    <label>付款方式
      <select v-model="payment" :disabled="draft.submitting"><option v-for="p in payments" :key="p">{{ p }}</option></select>
    </label>
    <div class="total">應收 {{ total }} 元</div>
    <label>實收 <input type="number" v-model.number="paid" min="0" class="w100" :disabled="draft.submitting"></label>
    <div class="total">找零 {{ Math.max(0, paidAmount - total) }} 元</div>
    <button class="primary" :disabled="draft.submitting || !draft.cart.length || paidAmount < total"
            @click="checkout">結帳</button>
  </div>
  <div v-if="doneMsg" class="done-msg">{{ doneMsg }}</div>
  <template v-if="recent.length">
  <div class="grp-title recent-sales-title">本日最近成交</div>
  <table>
    <thead><tr><th>編號</th><th>時間</th><th>員工</th><th>商品</th><th>應收</th></tr></thead>
    <tbody><tr v-for="s in recent" :key="s.sale_id">
      <td>{{ s.sale_id }}</td><td>{{ s.ts }}</td><td>{{ s.employee }}</td>
      <td>{{ itemsText(s) }}</td><td>{{ s.total }}</td>
    </tr></tbody>
  </table>
  </template>
</div>
</template>
<template id="tpl-labels">
<div class="page">
  <div class="scan-row">
    <input v-model="query" @keyup.enter="submitInput" :disabled="q.printing"
           placeholder="掃描條碼或輸入關鍵字" class="scan-input">
    <button @click="submitInput" :disabled="q.printing">加入</button>
  </div>
  <div v-if="searched && !results.length" class="notice-bar">查無此條碼或商品。</div>
  <div v-if="results.length" class="search-pop">
    <div v-for="r in results" :key="r.variant_id" class="search-item"
         :title="modelsTitle(r)" @click="pick(r)">{{ rowText(r) }}</div>
  </div>
  <div v-if="q.notice" class="notice-bar">{{ q.notice }}</div>
  <div v-if="q.rows.length" class="label-queue">
    <table>
      <thead><tr><th>品名</th><th>規格</th><th>價格</th><th>條碼</th>
        <th>張數</th><th>狀態</th><th></th></tr></thead>
      <tbody>
        <tr v-for="row in q.rows" :key="row.key" :class="{on: row.key === q.selectedKey}"
            @click="selectRow(row.key)">
          <td :title="(row.label.models || []).join('、') || null">{{ row.label.name }}</td>
          <td>{{ row.label.specification }}</td>
          <td>{{ row.label.price }}</td>
          <td>{{ row.barcode }}</td>
          <td><input type="number" min="1" class="w60" :value="row.copies"
                     :disabled="q.printing" @click.stop
                     @change="setCopies(row, $event.target.value)"></td>
          <td :class="{neg: row.status === 'verify' || row.status === 'invalid'}">{{ statusText(row) }}</td>
          <td>
            <button v-if="row.status === 'verify'" class="btn-sm" :disabled="q.printing"
                    @click.stop="confirmCopies(row)">確認張數</button>
            <button class="btn-sm danger" :disabled="q.printing"
                    @click.stop="removeRow(row)">移除</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="label-preview">
      <img v-if="q.previewUrl" :src="q.previewUrl" alt="標籤預覽">
    </div>
  </div>
  <div v-if="q.rows.length" class="label-panel">
    <button class="primary" :disabled="q.printing" @click="printAll">
      {{ q.printing ? '列印中…' : `全部列印（共 ${totalCopies()} 張）` }}</button>
    <button :disabled="q.printing" @click="clearAll">清空清單</button>
  </div>
</div>
</template>
<template id="tpl-receive">
<div class="page receive">
  <div class="scan-row"><employee-picker></employee-picker></div>
  <div class="scan-row">
    <input ref="scan" v-model="scanCode" @keyup.enter="onScan"
           placeholder="掃描條碼進貨" class="scan-input">
  </div>
  <div v-if="draft.notFound" class="notice-bar">
    查無條碼「{{ draft.notFound }}」。進貨不建立產品，{{ isAdmin ? '請先至商品設定建立產品與子產品。' : '請管理者先建立產品與子產品。' }}
    <button v-if="isAdmin" @click="goSettings">前往商品設定</button>
  </div>
  <table class="cart-table receive-table">
    <colgroup>
      <col><col>
      <col class="receive-col-barcode"><col class="cart-col-stock"><col class="receive-col-qty">
      <col class="receive-col-label"><col class="cart-col-remove">
    </colgroup>
    <thead><tr><th>商品</th><th>規格</th><th>條碼</th><th>目前庫存</th>
      <th>進貨數量</th><th>標籤</th><th></th></tr></thead>
    <tbody>
      <tr v-if="!draft.rows.length"><td colspan="7" class="hint">請掃描條碼加入進貨清單。</td></tr>
      <tr v-for="row in draft.rows" :key="row.variant_id"
          :class="{'receive-row-hit': draft.highlightKey === row.variant_id}">
        <td>{{ row.name }}</td>
        <td>{{ attrText(row) }}</td>
        <td>{{ row.label_barcode }}</td>
        <td>{{ row.stock }}</td>
        <td><input type="number" :value="row.qty" min="1" class="w80"
                   :disabled="draft.locked" @change="setQty(row, $event)"></td>
        <td><button v-if="row.qty > row.labeled" class="btn-sm"
                    :disabled="row.labelBusy || draft.locked" @click="addToLabels(row)">加入列印清單（{{ row.qty - row.labeled }} 張）</button>
            <span v-else-if="row.labeled > 0" class="hint">已加入 {{ row.labeled }} 張</span></td>
        <td><button class="btn-x" title="移除" :disabled="draft.locked" @click="removeRow(row)">✕</button></td>
      </tr>
    </tbody>
  </table>
  <div class="pay-panel">
    <div>共 {{ draft.rows.length }} 項、{{ totalQty }} 件</div>
    <button class="primary" :disabled="draft.locked || !draft.rows.length" @click="confirmReceive">確認進貨</button>
    <button :disabled="draft.locked || !draft.rows.length" @click="clearAll">清空</button>
  </div>
  <div v-if="draft.doneMsg" class="done-msg">{{ draft.doneMsg }}</div>
</div>
</template>
<template id="tpl-stocktake">
<div class="page">
  <div v-if="!current">
    <div class="scan-row">
      <employee-picker></employee-picker>
      <button class="primary" @click="openNew">開新盤點單</button>
    </div>
    <table>
      <thead><tr><th>單號</th><th>開始時間</th><th>狀態</th><th>員工</th><th></th></tr></thead>
      <tbody><tr v-for="s in sessions" :key="s.session_id">
        <td>{{ s.session_id }}</td><td>{{ s.started_at }}</td>
        <td>{{ s.status === 'open' ? '進行中' : s.status === 'pending' ? '待核准' : '已結案' }}</td><td>{{ s.employee }}</td>
        <td><div class="card-actions">
            <button v-if="s.status==='open'" @click="enter(s.session_id)">續盤</button>
            <button v-else @click="enter(s.session_id)">{{ s.status==='pending' && isAdmin ? '審核' : '檢視' }}</button>
            <button v-if="s.status==='pending'" @click="withdraw(s.session_id)">抽回修改</button></div></td>
      </tr></tbody>
    </table>
  </div>
  <div v-else>
    <div class="scan-row">
      <input ref="scan" v-model="scanCode" @keyup.enter="onScan"
             class="scan-input" placeholder="掃描條碼(重複掃自動累加)"
             :disabled="detail.status!=='open'">
      <button @click="current=null; detail=null; reload()">返回列表</button>
      <button class="primary" v-if="detail.status==='open'" @click="close">送出</button>
      <button class="primary" v-if="canReview" :disabled="marked.length > 0" @click="approve">核准</button>
      <button class="primary" v-if="canReview" :disabled="!marked.length" @click="returnItems">退回重盤（{{ marked.length }} 項）</button>
    </div>
    <div v-if="detail.status==='pending' && !isAdmin" class="notice-bar">等待管理者核准</div>
    <div v-if="recountCount" class="notice-bar">有 {{ recountCount }} 項需重新清點</div>
    <table>
      <thead><tr><th>商品</th><th>屬性</th><th>系統量</th><th>實盤量</th><th>差異</th>
        <th v-if="canReview"></th><th v-if="canEditCounted" class="cart-col-remove"></th></tr></thead>
      <tbody><tr v-for="it in detail.items" :key="it.variant_id" :class="{neg: it.needs_recount, 'stocktake-row-returned': marked.includes(it.variant_id)}">
        <td>{{ it.name }}</td><td>{{ attrText(it) }}</td>
        <td>{{ it.system_qty }}</td>
        <td><input type="number" v-model.number="it.counted_qty" min="0" class="w80"
                   :disabled="!canEditCounted" @change="setCounted(it)">
          <button v-if="it.needs_recount && canEditCounted" class="btn-sm" @click="setCounted(it)">確認</button></td>
        <td :class="{neg: it.diff < 0}">{{ it.diff > 0 ? '+' + it.diff : it.diff }}</td>
        <td v-if="canReview"><button v-if="marked.includes(it.variant_id)" class="btn-sm danger" @click="toggleMark(it)">取消退回</button>
          <button v-else class="btn-sm" @click="toggleMark(it)">退回</button></td>
        <td v-if="canEditCounted"><button class="btn-x" title="移除" @click="removeItem(it)">✕</button></td>
      </tr></tbody>
    </table>
  </div>
</div>
</template>
<template id="tpl-records">
<div class="page">
  <!-- 紀錄查詢:左側選類別(比照設定頁側欄),右側查詢與清單 -->
  <div class="prod-settings">
    <aside class="cat-list">
      <div class="cat-list-title">紀錄</div>
      <div v-for="[key, label] in kinds" :key="key" class="cat-item"
           :class="{active: kind===key}" @click="selectKind(key)">
        <span class="cat-name">{{ label }}</span>
      </div>
    </aside>
    <section class="cat-detail">
      <div class="scan-row">
        <label>起 <input type="date" v-model="dateFrom"></label>
        <label>迄 <input type="date" v-model="dateTo"></label>
        <select v-if="kind==='sales'" v-model="payment"><option value="">全部付款方式</option>
          <option v-for="p in payments" :key="p">{{ p }}</option></select>
        <button class="primary" @click="reload">查詢</button>
        <button v-if="kind==='sales' && isAdmin" @click="exportCsv">匯出 CSV</button>
      </div>
      <template v-if="kind==='sales'">
        <div v-if="summary" class="pay-panel">
          <div>{{ dateFrom }} 小結:{{ summary.count }} 筆,共 {{ summary.total }} 元</div>
          <div v-for="(amt, p) in summary.by_payment" :key="p">{{ p }}:{{ amt }} 元</div>
        </div>
        <table>
          <thead><tr><th>編號</th><th>時間</th><th>員工</th><th>付款</th><th>整單折抵</th><th>應收</th><th></th></tr></thead>
          <tbody>
            <template v-for="s in sales" :key="s.sale_id">
              <tr>
                <td>{{ s.sale_id }}</td><td>{{ s.ts }}</td><td>{{ s.employee }}</td><td>{{ s.payment }}</td>
                <td>{{ s.order_discount }}</td><td>{{ s.total }}</td>
                <td><button @click="toggle(s.sale_id)">{{ expanded===s.sale_id ? '收合' : '明細' }}</button></td>
              </tr>
              <tr v-if="expanded===s.sale_id"><td colspan="7">
                <div v-for="it in s.items">
                  {{ it.name }}|{{ attrText(it) }}|{{ it.qty }} 件 ×
                  {{ it.unit_price }} 元(折 {{ it.discount }})
                </div>
              </td></tr>
            </template>
          </tbody>
        </table>
      </template>
      <table v-else-if="kind==='receive'">
        <thead><tr><th>時間</th><th>員工</th><th>商品種類</th><th></th></tr></thead>
        <tbody>
          <template v-for="(r, i) in receipts" :key="r.receipt_id ?? 'old-' + i">
            <tr>
              <td>{{ r.ts }}</td><td>{{ r.employee ?? '—' }}</td>
              <td>{{ r.items.length }}</td>
              <td><button @click="toggle('r' + i)">{{ expanded==='r' + i ? '收合' : '明細' }}</button></td>
            </tr>
            <tr v-if="expanded==='r' + i"><td colspan="4">
              <div v-for="it in r.items">
                {{ it.name }}|{{ attrText(it) }}|進貨 {{ it.qty }} 件(目前庫存 {{ it.stock }} 件)
              </div>
            </td></tr>
          </template>
        </tbody>
      </table>
      <table v-else>
        <thead><tr><th>單號</th><th>開始時間</th><th>核准時間</th><th>員工</th><th>差異項數</th><th></th></tr></thead>
        <tbody>
          <template v-for="t in stocktakes" :key="t.session_id">
            <tr>
              <td>{{ t.session_id }}</td><td>{{ t.started_at }}</td><td>{{ t.approved_at || '—' }}</td>
              <td>{{ t.employee }}</td><td>{{ t.diff_count }}</td>
              <td><button @click="toggle(t.session_id)">{{ expanded===t.session_id ? '收合' : '明細' }}</button></td>
            </tr>
            <tr v-if="expanded===t.session_id"><td colspan="6">
              <div v-for="it in t.items">
                {{ it.name }}|{{ attrText(it) }}|系統 {{ it.system_qty }}、實盤 {{ it.counted_qty }}、差異
                {{ it.diff > 0 ? '+' + it.diff : it.diff }}
              </div>
            </td></tr>
          </template>
        </tbody>
      </table>
    </section>
  </div>
</div>
</template>
    </tbody>
  </table>
</div>
</template>
<template id="tpl-catalog">
<div class="page">
  <div class="catalog-card">
  <div class="scan-row catalog-filter-row">
    <select v-model="fCategory" @change="onCategoryChange">
      <option :value="null">全部種類</option>
      <option v-for="c in categories" :key="c.category_id" :value="c.category_id">{{ c.name }}</option>
    </select>
    <select v-model="fBrand" @change="reload">
      <option :value="null">全部廠牌</option>
      <option v-for="b in brands" :key="b.brand_id" :value="b.brand_id">{{ b.name }}</option>
    </select>
    <select v-model="fModel" @change="reload">
      <option :value="null">全部型號</option>
      <option v-for="m in models" :key="m.model_id" :value="m.model_id">{{ modelLabel(m) }}</option>
    </select>
    <input v-model="q" @keyup.enter="reload" class="catalog-search-input"
           placeholder="搜尋名稱、規格或條碼">
    <button class="primary" @click="reload">查詢</button>
    <label class="chk"><input type="checkbox" v-model="includeInactive" @change="reload"> 顯示已停用</label>
    <label v-if="isAdmin" class="chk"><input type="checkbox" v-model="pending" @change="reload"> 待處理<span v-if="pendingCount" class="badge">{{ pendingCount }}</span></label>
    <button v-if="isAdmin" class="catalog-add-btn" @click="openAddVariant(null)">新增</button>
  </div>
  <div class="catalog-table-scroll">
  <table class="sub catalog-table">
    <colgroup>
      <col class="catalog-col-model">
      <col class="catalog-col-spec">
      <col class="catalog-col-stock">
      <col class="catalog-col-barcode">
      <col class="catalog-col-price">
      <col class="catalog-col-effective-price">
      <col class="catalog-col-status">
      <col class="catalog-col-actions">
    </colgroup>
    <thead><tr><th>型號</th><th>規格</th><th>庫存</th><th>條碼</th>
      <th>自身售價</th><th>有效售價</th><th>狀態</th><th>操作</th></tr></thead>
    <tbody>
      <template v-for="p in displayProducts" :key="p.product_id">
        <tr class="catalog-product-row" :class="{inactive: !p.active}">
          <td colspan="6" class="catalog-product-info">
            <strong>{{ p.name }}</strong>
            <span v-if="!p.active" class="catalog-inactive-badge">已停用</span>
            <button v-if="isAdmin && p.active" class="btn-sm" @click="openAddVariant(p)">新增款式</button>
          </td>
          <td colspan="2" class="catalog-product-actions">
            <button v-if="isAdmin" class="btn-sm" @click="editInSettings(p)">修改規格</button>
            <button v-if="isAdmin" class="btn-sm" @click="toggleProductActive(p)">{{ p.active ? '停用' : '啟用' }}</button>
            <button v-if="isAdmin" class="btn-sm" @click="deleteProduct(p)">刪除</button>
          </td>
        </tr>
        <tr v-for="{ v, showModel, rowspan } in groupedVariants(p)" :key="v.variant_id"
            class="catalog-variant-row" :class="{inactive: !v.active}">
          <td v-if="showModel" :rowspan="rowspan" class="catalog-model-cell">
            <template v-if="modelLines(p, v).length"><div v-for="(m, mi) in modelLines(p, v)" :key="mi"
                 class="catalog-model-line">{{ m }}{{ mi === modelLines(p, v).length - 1 ? '' : '、' }}</div></template>
            <template v-else>—</template>
          </td>
          <td>
            {{ attrText(v, '（無規格）') }}
            <div v-if="v.issues && v.issues.length" class="issue-box">
              <div class="issue-tag">待處理</div>
              <div v-for="(it, ii) in v.issues" :key="ii" class="issue-line">{{ issueText(it) }}</div>
            </div>
          </td>
          <td :class="{neg: v.stock < 0}">{{ v.stock }}</td>
          <td>
            <span v-if="mainBarcode(v)" class="bc-line">
              <span class="bc-number" :title="mainBarcode(v).barcode">{{ mainBarcode(v).barcode }}</span><span class="bc-tag">{{ mainBarcode(v).source === 'store' ? '(自)' : '' }}</span><span
                v-if="v.barcodes.length > 1" class="bc-more">+{{ v.barcodes.length - 1 }}</span>
              <button v-if="v.active && !(v.issues && v.issues.length)"
                      class="btn-sm" @click="printLabel(p, v)">印標籤</button>
            </span>
            <button v-else-if="isAdmin" class="btn-sm" @click="openVariantEditor(p, v)">管理</button>
          </td>
          <td>{{ v.price === null ? '—' : v.price }}</td>
          <td>{{ v.effective_price === null ? '未定價' : v.effective_price }}</td>
          <td>{{ v.issues && v.issues.length ? '待處理' : (v.active ? '啟用' : '已停用') }}</td>
          <td>
            <template v-if="isAdmin && v.issues && v.issues.length">
              <button class="btn-sm" @click="openVariantEditor(p, v)">編輯</button>
              <button class="btn-sm" @click="deleteVariant(p, v)">刪除</button>
            </template>
            <template v-else-if="isAdmin">
              <button class="btn-sm" @click="openVariantEditor(p, v)">編輯</button>
              <button class="btn-sm" @click="toggleVariantActive(p, v)">{{ v.active ? '停用' : '啟用' }}</button>
              <button class="btn-sm" @click="deleteVariant(p, v)">刪除</button>
            </template>
          </td>
        </tr>
      </template>

  </table>

       class="done-msg catalog-empty-result">
    {{ isAdmin ? '查無符合的商品，請確認關鍵字或至設定新增。' : '查無符合的商品，請確認關鍵字。' }}
  </div>
  </div>
</div>
</template>

          <span v-if="!activeSpecRows.length" class="hint">尚未啟用任何規格</span>

      <div class="inline-add add-before-list">
        <input v-model="newField.name" placeholder="新規格名稱"
               @keyup.enter="addTemplateField">
        <select v-model="newField.field_type">
          <option value="select">下拉選單</option>
          <option value="text">文字</option>
          <option value="multi">複選</option>
        </select>
        <button class="primary" @click="addTemplateField">新增</button>
      </div>
      <!-- 固定項目(適用機型、特性詞條):名稱與型態以純文字呈現,只留啟用開關 -->
      <div class="maint-row fixed-row" v-for="f in fixedRows" :key="f.field_id">
        <span class="fixed-name name">{{ f.name }}</span>
        <button class="switch" type="button" role="switch"
                :class="{on: !!f.cf_active}" :aria-checked="!!f.cf_active"

        <span class="switch-label">{{ f.cf_active ? '啟用' : '停用' }}</span>
      </div>
      <sortable-list :items="customRows" item-key="field_id" active-key="cf_active"
                     :auto-save="true" @save="saveFieldSort">
        <template #row="{ item: f }">
          <input class="name" v-model="f.name"
                 @keyup.enter="saveFieldName(f)" @blur="saveFieldName(f)">
          <select :value="f.field_type" @change="setFieldType(f, $event.target.value)">
            <option value="select">下拉選單</option>
            <option value="text">文字</option>
            <option value="multi">複選</option>
          </select>
          <button class="btn-sm" :class="{invisible: !hasOptions(f)}"
                  :tabindex="hasOptions(f) ? 0 : -1"
                  @click.stop="hasOptions(f) && openFieldPopup(f)">✎ 選項</button>
          <button class="chip-toggle" type="button" :class="{on: !!f.required}"
                  :aria-pressed="!!f.required" title="切換必填／選填"
                  @click.stop="setFieldRequired(f, !f.required)">

          <button class="btn-x" title="刪除規格" @click.stop="deleteTemplateField(f)">✕</button>
          <button class="switch" type="button" role="switch"
                  :class="{on: !!f.cf_active}" :aria-checked="!!f.cf_active"
                  @click.stop="setFieldActive(f, !f.cf_active)"><span class="knob"></span></button>
          <span class="switch-label">{{ f.cf_active ? '啟用' : '停用' }}</span>
        </template>
      </sortable-list>
      </template>

      <div class="card-head prod-head">
        <span class="grp-title">本商品種類產品</span>
        <button class="primary" @click="openProductPopup(null)">加入廠牌(供應商)</button>
      </div>
      <table class="big-prod">
        <thead><tr><th>名稱</th><th>廠牌</th><th>子產品</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody>
          <tr v-for="p in bigProducts" :key="p.product_id" :class="{inactive: !p.active}">
            <td>{{ p.name }}</td>
            <td>{{ p.brand_name || '—' }}</td>

            <td>{{ p.active ? '啟用' : '已停用' }}</td>
            <td>
              <button class="btn-sm" @click="openProductPopup(p)">修改</button>
              <button class="btn-sm" @click="toggleProductActive(p)">
                {{ p.active ? '停用' : '啟用' }}</button>
              <button class="btn-sm danger" @click="deleteProduct(p)">刪除</button>
            </td>
          </tr>
          <tr v-if="!bigProducts.length"><td colspan="5" class="hint">此種類尚無產品。</td></tr>
        </tbody>
      </table>
    </section>
    <section class="cat-detail" v-else-if="section==='category'">
      <div class="hint">請於左側選擇或新增商品種類。</div>
    </section>

    <section class="cat-detail" v-else-if="section==='password'">
      <div class="card-head"><h3>管理者密碼</h3></div>

      <div class="create-form">
        <label>舊密碼 <input type="password" v-model="passwordForm.old" autocomplete="current-password"></label>
        <label>新密碼 <input type="password" v-model="passwordForm.next" autocomplete="new-password"></label>
        <label>確認新密碼 <input type="password" v-model="passwordForm.confirm" autocomplete="new-password"></label>
        <button type="button" class="primary" @click="changePassword">變更密碼</button>
      </div>
    </section>

    <!-- 基礎資料:廠牌 -->
    <section class="cat-detail" v-else-if="section==='brands'">
      <div class="card-head"><h3>廠牌(供應商)</h3>
        <span class="card-actions">
          <button v-if="hasUnsaved('brands')" @click="revertAll('brands')">復原</button>
          <button class="primary" @click="saveAll('brands')">儲存修改</button>
        </span></div>
      <div v-if="hasUnsaved('brands')" class="notice-bar">
        ⚠ 有未儲存的修改，調整順序或修改名稱後請按「儲存修改」</div>
      <div v-if="pageError && errorScope==='brands'" class="error-bar section-bar">⚠ {{ pageError }}</div>

        <span v-if="!editDeviceTypes" class="spec-tags">

        <button class="primary" @click="addModel">新增</button>

      <div v-for="g in modelGroups" :key="g.brand" class="model-group">

        <transition name="collapse">
        <sortable-list v-if="isBrandOpen(g.brand)" :items="g.items" item-key="model_id"
                       :disabled="!!modelQuery.trim()"
                       @pending="onModelSortPending(g.brand, $event)">
          <template #row="{ item: m }">
            <input class="name" v-model="m.name">
            <input class="w120" v-model="m.alias" placeholder="別名(選填)">
            <select v-model.number="m.device_type_id" title="裝置類型">
              <option v-for="dt in deviceTypes" :key="dt.device_type_id"

            <button @click="toggleActive('models', m)">{{ m.active ? '停用' : '啟用' }}</button>
            <button @click="deleteItem('models', m)">刪除</button>
          </template>
        </sortable-list>
        </transition>
      </div>
    </section>

  <!-- 產品 popup(單層) -->
  <div v-if="prodPopup" class="modal-overlay" @click.self="prodPopup=null">
    <div class="modal">
      <h3>{{ prodPopup.mode==='new' ? '新增產品' : '修改產品' }}</h3>
      <label>廠牌
        <combo-box :model-value="prodPopup.brandQuery" :options="brands"
                   option-key="brand_id" option-label="name" :autofocus="true"
                   placeholder="搜尋或輸入廠牌" :allow-create="true" empty-text="尚無廠牌"
                   @update:model-value="onBrandQueryInput"
                   @select="pickBrand" @create="addInlineBrand"></combo-box>

      <div v-if="prodPopup.brand_name" class="field-note">

      <label>備註 <input v-model="prodPopup.note" placeholder="選填"></label>

        <button @click="prodPopup=null">取消</button>
      </div>
    </div>
